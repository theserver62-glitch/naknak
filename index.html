<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>낙낙 - 취미찾기</title>
<meta name="description" content="질문 12개에 답하면 지금의 나에게 맞는 취미를 219개 중에서 골라 드려요. 시작하는 법, 준비물, 시작 비용까지.">
<meta property="og:type" content="website">
<meta property="og:title" content="낙낙 - 취미찾기">
<meta property="og:description" content="질문 12개에 답하면 지금의 나에게 맞는 취미를 219개 중에서 골라 드려요. 시작하는 법, 준비물, 시작 비용까지.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B1%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2C47DB">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>body{margin:0}</style>
</head>
<body>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  /* Layout: one-column app shell (max 560px); screens swap in place; the ticket is the only loud element */
  --bg:#EDF0F5;
  --surface:#FFFFFF;
  --surface-2:#F4F6FA;
  --ink:#141830;
  --muted:#596079;
  --line:#D5DBE6;
  --accent:#2C47DB;
  --accent-ink:#FFFFFF;
  --accent-soft:#E3E8FF;
  --want:#E0455F; --want-soft:#FDE6EA;
  --c-move:#2C47DB; --c-move-ink:#FFFFFF;
  --c-make:#F2A900; --c-make-ink:#1F1700;
  --c-think:#7448D4; --c-think-ink:#FFFFFF;
  --c-nature:#23855A; --c-nature-ink:#FFFFFF;
  --note-bg:#FFF7DD; --note-line:#D9AE36; --note-ink:#574200;
  --shadow:0 1px 2px rgba(20,24,48,.06),0 8px 20px rgba(20,24,48,.07);
  --shadow-up:0 -6px 24px rgba(20,24,48,.10);
  --scrim:rgba(237,240,245,.88);
  --f-display:"Bagel Fat One","Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --fs-12:12px;--fs-14:14px;--fs-16:16px;--fs-18:18px;--fs-22:22px;--fs-28:28px;
  --f-mono:var(--f-body);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F121B; --surface:#181C29; --surface-2:#1E2333; --ink:#E8EBF4; --muted:#9BA2B8; --line:#2A3043;
    --accent:#8095FF; --accent-ink:#0B0E1A; --accent-soft:#222A4D;
    --want:#FF7A90; --want-soft:#3A1C24;
    --c-move:#8095FF; --c-move-ink:#0B0E1A; --c-make:#FFC53D; --c-make-ink:#1F1700;
    --c-think:#B396FF; --c-think-ink:#140B2A; --c-nature:#5BCB8E; --c-nature-ink:#06180F;
    --note-bg:#2A2410; --note-line:#8C7228; --note-ink:#F1D88A;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 20px rgba(0,0,0,.25);
    --shadow-up:0 -6px 24px rgba(0,0,0,.35);
    --scrim:rgba(15,18,27,.88);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F121B; --surface:#181C29; --surface-2:#1E2333; --ink:#E8EBF4; --muted:#9BA2B8; --line:#2A3043;
  --accent:#8095FF; --accent-ink:#0B0E1A; --accent-soft:#222A4D;
  --want:#FF7A90; --want-soft:#3A1C24;
  --c-move:#8095FF; --c-move-ink:#0B0E1A; --c-make:#FFC53D; --c-make-ink:#1F1700;
  --c-think:#B396FF; --c-think-ink:#140B2A; --c-nature:#5BCB8E; --c-nature-ink:#06180F;
  --note-bg:#2A2410; --note-line:#8C7228; --note-ink:#F1D88A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 20px rgba(0,0,0,.25);
  --shadow-up:0 -6px 24px rgba(0,0,0,.35);
  --scrim:rgba(15,18,27,.88);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:var(--fs-16);line-height:1.6;word-break:keep-all;overflow-wrap:anywhere;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 56px}
.app.has-live{padding-block-end:150px}

[data-cat="move"]{--cat:var(--c-move);--cat-ink:var(--c-move-ink)}
[data-cat="make"]{--cat:var(--c-make);--cat-ink:var(--c-make-ink)}
[data-cat="think"]{--cat:var(--c-think);--cat-ink:var(--c-think-ink)}
[data-cat="nature"]{--cat:var(--c-nature);--cat-ink:var(--c-nature-ink)}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;margin-inline:-16px;padding-inline:8px 16px;background:var(--scrim);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.bar-row{display:flex;align-items:center;gap:6px;min-height:52px}
.bar-title{font-weight:600;font-size:var(--fs-16);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-end{margin-left:auto;font-family:var(--f-mono);font-size:var(--fs-14);color:var(--muted);font-variant-numeric:tabular-nums}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border:0;background:transparent;border-radius:10px;cursor:pointer}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.prog{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:0 0 10px 8px}
.prog i{height:4px;border-radius:2px;background:var(--line)}
.prog i.on{background:var(--accent)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:var(--fs-16);cursor:pointer;text-decoration:none;color:var(--ink);text-align:center}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.block{width:100%}
.btn .sub{font-weight:600;opacity:.8;font-size:var(--fs-14)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* home */
.home{display:grid;gap:22px;padding-top:36px}
.brand{font-weight:700;font-size:var(--fs-14);letter-spacing:-.01em;color:var(--muted)}
.brand b{font-family:var(--f-display);font-weight:400;font-size:var(--fs-18);letter-spacing:0;color:var(--ink);margin-right:6px}
.hero-title{font-family:var(--f-display);font-weight:400;font-size:var(--fs-28);line-height:1.18;margin:0;letter-spacing:-.01em;text-wrap:balance}
.lede{margin:0;color:var(--muted);max-width:34em}
.stack{position:relative;height:226px}
.mini{position:absolute;width:min(330px,88%);display:grid;grid-template-columns:minmax(0,1fr) 74px;background:var(--surface);border-radius:14px;box-shadow:var(--shadow)}
.mini:nth-child(1){top:0;left:2%;transform:rotate(-4deg)}
.mini:nth-child(2){top:76px;left:9%;transform:rotate(2.5deg)}
.mini:nth-child(3){top:150px;left:3%;transform:rotate(-1.2deg)}
.mini .mm{padding:12px 16px;min-width:0}
.mini .mn{font-family:var(--f-display);font-size:var(--fs-22);line-height:1.2}
.mini .mt{font-size:var(--fs-12);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .ms{background:var(--cat);color:var(--cat-ink);border-radius:0 14px 14px 0;border-left:3px dotted var(--surface);display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:600;font-size:var(--fs-18);font-variant-numeric:tabular-nums}
.cta{display:grid;gap:10px}
.peek h2{font-size:var(--fs-14);font-weight:600;color:var(--muted);margin:0 0 10px;letter-spacing:-.01em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip-btn{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:var(--fs-14);cursor:pointer}
.chip-btn:hover{border-color:var(--muted)}
.chip-btn .rare-mark{font-size:var(--fs-12);font-weight:700;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--cat);flex:none}
.foot{font-size:var(--fs-12);color:var(--muted);margin:0;border-top:1px solid var(--line);padding-top:16px}

/* quiz */
.quiz{display:grid;gap:20px;padding-top:20px}
.q-num{font-family:var(--f-mono);font-size:var(--fs-14);color:var(--accent);font-weight:600}
.q-text{font-size:var(--fs-28);font-weight:700;line-height:1.35;margin:4px 0 0;text-wrap:balance}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;padding:16px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;font-weight:600;font-size:var(--fs-16);line-height:1.4;text-align:left;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--muted)}
.opt .ring{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] .ring{border-color:var(--accent)}
.opt[aria-pressed="true"] .ring::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
.q-hint{font-size:var(--fs-14);color:var(--muted);margin:0}

/* live recommendations */
.live{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);box-shadow:var(--shadow-up);border-top:1px solid var(--line);padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.live-in{max-width:528px;margin:0 auto;display:grid;gap:8px}
.live-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:var(--fs-12);font-weight:600;color:var(--muted)}
.live-h small{font-weight:600;font-size:var(--fs-12)}
.live-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.live-chip{display:grid;gap:0;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);text-align:left;cursor:pointer;min-width:0;position:relative;overflow:hidden;transition:background .4s}
.live-chip::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--cat)}
.live-chip .ln{font-weight:600;font-size:var(--fs-14);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live-chip .lp{font-family:var(--f-mono);font-size:var(--fs-12);color:var(--muted);font-variant-numeric:tabular-nums}
.live-chip.fresh{background:var(--accent-soft)}
.live-empty{font-size:var(--fs-14);color:var(--muted);padding:6px 0}

/* result */
.result{display:grid;gap:26px;padding-top:20px}
.eyebrow{font-size:var(--fs-14);font-weight:600;color:var(--accent);margin:0 0 6px}
.r-title{font-family:var(--f-display);font-weight:400;font-size:var(--fs-28);line-height:1.2;margin:0;text-wrap:balance}
.r-sum{margin:10px 0 0;color:var(--muted)}
.r-sum b{color:var(--ink);font-weight:600}
.sample-note{padding:12px 14px;border-radius:12px;background:var(--accent-soft);font-size:var(--fs-14)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:var(--fs-14);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tab-note{margin:-6px 0 0;font-size:var(--fs-14);color:var(--muted)}
.tab-block{display:grid;gap:14px}
.tickets{display:grid;gap:14px}
.ticket{display:grid;grid-template-columns:minmax(0,1fr) 92px;width:100%;text-align:left;background:var(--surface);border:0;border-radius:16px;padding:0;cursor:pointer;position:relative;box-shadow:var(--shadow);transition:transform .15s}
.ticket:hover{transform:translateY(-2px)}
.ticket::before,.ticket::after{content:"";position:absolute;right:92px;width:18px;height:18px;border-radius:50%;background:var(--bg);transform:translateX(50%)}
.ticket::before{top:-9px}
.ticket::after{bottom:-9px}
.t-main{padding:18px 20px 18px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.t-cat{font-size:var(--fs-12);font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
.t-name{font-family:var(--f-display);font-size:var(--fs-28);line-height:1.15}
.t-tag{font-size:var(--fs-14);color:var(--muted)}
.t-why{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tag{font-size:var(--fs-12);font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.tag.warn{background:var(--note-bg);border-color:var(--note-line);color:var(--note-ink)}
.t-stub{background:var(--cat);color:var(--cat-ink);border-radius:0 16px 16px 0;border-left:3px dotted var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:12px 6px;text-align:center}
.t-rank{font-size:var(--fs-12);font-weight:600;opacity:.85}
.t-pct{font-family:var(--f-display);font-weight:400;font-size:var(--fs-28);line-height:1;font-variant-numeric:tabular-nums}
.t-pct.word{font-family:var(--f-body);font-size:var(--fs-16);line-height:1.25;text-align:center}
.t-pct small{font-size:var(--fs-14)}
.t-lab{font-size:var(--fs-12);opacity:.85}
.surprise{display:grid;gap:10px}
.surprise-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.surprise-h b{font-size:var(--fs-16)}
.surprise-h span{font-size:var(--fs-14);color:var(--muted)}
.ticket.rare{background:var(--surface);outline:2px dashed var(--cat);outline-offset:-2px;box-shadow:none}
.sec-h{font-size:var(--fs-18);font-weight:700;margin:0 0 12px}
.spec-list{display:grid;gap:14px;background:var(--surface);border-radius:16px;padding:18px}
.spec{display:grid;grid-template-columns:4.6em minmax(0,1fr) 4.6em;align-items:center;gap:10px;font-size:var(--fs-14)}
.spec span{color:var(--muted)}
.spec span.lean{color:var(--ink);font-weight:600}
.spec .r{text-align:right}
.track{position:relative;height:6px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line)}
.track::before{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:1px;background:var(--line)}
.track.unk{border-style:dashed;background:transparent;height:auto;min-height:22px;display:flex;align-items:center;justify-content:center}
.track.unk::before{display:none}
.track.unk em{font-style:normal;font-size:var(--fs-12);color:var(--muted)}
.spec-note{font-size:var(--fs-12);color:var(--muted);margin:8px 2px 0}
.fact dd small{display:block;font-size:var(--fs-12);color:var(--muted);font-weight:400;margin-top:2px}
.choice{display:grid;gap:6px}
.choice button{min-height:44px;text-align:left;padding:10px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface-2);font-size:var(--fs-14);cursor:pointer;color:var(--ink)}
.choice button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.knob{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:var(--accent);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--accent);transform:translate(-50%,-50%)}
.rows{display:grid;gap:8px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;cursor:pointer;text-align:left}
.row:hover{border-color:var(--muted)}
.row .rn{font-weight:600}
.row .rt{font-size:var(--fs-14);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.row .rp{font-family:var(--f-mono);font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted)}

/* feedback */
.feedback{display:grid;gap:16px;padding:20px 18px;background:var(--surface);border-radius:16px;border:1.5px dashed var(--line)}
.feedback h2{margin:0;font-size:var(--fs-18)}
.feedback .sub{margin:-10px 0 0;font-size:var(--fs-14);color:var(--muted)}
.fb-q{display:grid;gap:8px}
.fb-q > label,.fb-q > .fb-label{font-weight:600;font-size:var(--fs-14)}
.rate{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rate button{min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface-2);font-family:var(--f-mono);font-weight:600;cursor:pointer}
.rate button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rate-legend{display:flex;justify-content:space-between;font-size:var(--fs-12);color:var(--muted)}
.fb-wants{font-size:var(--fs-14);color:var(--muted)}
.fb-wants b{color:var(--ink)}
.field{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);font-size:var(--fs-16)}
.field:focus{outline:none;border-color:var(--accent)}
textarea.field{min-height:84px;resize:vertical}
.fb-status{font-size:var(--fs-14);color:var(--accent);font-weight:600;margin:0}

/* detail */
.detail{display:grid;padding-top:16px}
.d-head{display:grid;gap:12px;padding-bottom:22px}
.d-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.d-cat{display:inline-flex;align-items:center;gap:8px;padding:4px 12px 4px 10px;border-radius:999px;background:var(--cat);color:var(--cat-ink);font-size:var(--fs-14);font-weight:600}
.d-cat .dot{background:var(--cat-ink)}
.d-rare{font-size:var(--fs-12);font-weight:600;color:var(--muted);border:1px dashed var(--line);border-radius:999px;padding:3px 10px}
.d-name{font-family:var(--f-display);font-weight:400;font-size:var(--fs-28);line-height:1.1;margin:0}
.d-tag{margin:0;font-size:var(--fs-16);color:var(--muted)}
.d-fit{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:var(--fs-14)}
.d-fit .pct{font-family:var(--f-mono);font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.want-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;border:1.5px solid var(--want);background:var(--surface);color:var(--want);font-weight:700;cursor:pointer}
.want-btn svg{width:20px;height:20px;stroke:currentColor;stroke-width:2;fill:none}
.want-btn[aria-pressed="true"]{background:var(--want);color:var(--surface)}
.want-btn[aria-pressed="true"] svg{fill:currentColor}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:0}
.fact{background:var(--surface);padding:12px 14px;min-width:0}
.fact dt{font-size:var(--fs-12);color:var(--muted);margin:0}
.fact dd{margin:2px 0 0;font-weight:600;font-size:var(--fs-14);font-variant-numeric:tabular-nums}
.sec{display:grid;gap:14px;padding-block:24px;border-top:1px solid var(--line)}
.sec h2{font-size:var(--fs-18);font-weight:700;margin:0}
.sec .sub{margin:-8px 0 0;font-size:var(--fs-14);color:var(--muted)}
.why{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.why li{display:grid;grid-template-columns:10px minmax(0,1fr);gap:12px;align-items:start}

function hasBatchim(word){
  const c = word.trim().slice(-1).charCodeAt(0);
  if (c < 0xAC00 || c > 0xD7A3) return false;
  return (c - 0xAC00) % 28 !== 0;
}

function man(v){
  const r = v >= 10 ? Math.round(v) : Math.round(v * 10) / 10;
  return Number.isInteger(r) ? String(r) : r.toFixed(1);
}
function priceRange(lo, hi){
  if (lo === 0 && hi === 0) return '0원';
  const small = v => Math.round(v * 10) + '천';
  if (lo === hi) return lo < 1 ? small(lo) + ' 원' : man(lo) + '만 원';
  if (hi < 1) return (lo === 0 ? '0' : small(lo)) + '~' + small(hi) + ' 원';
  if (lo > 0 && lo < 1) return small(lo) + '~' + man(hi) + '만 원';
  return man(lo) + '~' + man(hi) + '만 원';
}
function isBuyLink(u){ return typeof u === 'string' && /^https:\/\/(link\.coupang\.com|www\.coupang\.com|coupa\.ng)\//.test(u); }
function buyLink(h, name){ const m = !h.adult && BUY_LINKS[h.id]; return m && isBuyLink(m[name]) ? m[name] : ''; }
function gearPrice(g){

}
const _costCache = {};
// 시작 비용 = 꼭 필요한 준비물 + 꼭 필요한 이용료 1회분(데이터에 적힌 단위: 1회·1박·시간당·월).
// 몇 번 다니는지는 데이터에 없어서 한 달 비용은 만들지 않고, 월 단위 항목이 있을 때만 '계속하면'으로 따로 보여줌
const UNIT_FIRST = {'1회':'첫 1회', '월':'첫 달', '1박':'첫 1박', '시간당':'첫 1시간'};
function costInfo(h){
  if (_costCache[h.id]) return _costCache[h.id];
  let lo = 0, hi = 0;
  const rec = {};
  h.g.forEach(g => {
    if (!g[1]) return;
    if (g[4]) { rec[g[4]] = rec[g[4]] || [0, 0]; rec[g[4]][0] += g[2]; rec[g[4]][1] += g[3]; }
    else { lo += g[2]; hi += g[3]; }
  });
  const recList = Object.keys(rec).map(u => ({u, lo: rec[u][0], hi: rec[u][1]}));
  const startLo = lo + recList.reduce((s, r) => s + r.lo, 0);
  const startHi = hi + recList.reduce((s, r) => s + r.hi, 0);
  const parts = [];
  if (hi > 0) parts.push('준비물 ' + priceRange(lo, hi));
  recList.forEach(r => parts.push((UNIT_FIRST[r.u] || r.u) + ' ' + priceRange(r.lo, r.hi)));
  const monthly = h.g.filter(g => g[4] === '월').map(g => ({name: g[0], req: !!g[1], lo: g[2], hi: g[3]}));
  const label = startHi > 0 ? priceRange(startLo, startHi) : '거의 0원';
  return (_costCache[h.id] = {lo, hi, recList, startLo, startHi, parts, monthly, label});
}
function keepCostText(ci){
  if (ci.monthly.length) return '계속하면 ' + ci.monthly.map(m => m.name + ' 한 달 ' + priceRange(m.lo, m.hi) + (m.req ? '' : '(선택)')).join(', ');
  const per = ci.recList.filter(r => r.u !== '월');

  return '목록에 정기적으로 드는 비용은 없어요';
}
const BUDGET_CAP = [0, 5, 20, 50, Infinity];  // 예산 답 1~4의 상한(만 원)
function costLevel(v){ return v <= 5 ? 1 : v <= 20 ? 2 : v <= 50 ? 3 : 4; }
// 가격 범위 전체가 예산 안 'in', 싸게 시작하면 예산 안 'edge', 가장 싸도 넘음 'over'
function budgetFit(h, p){ const c = costInfo(h), cap = BUDGET_CAP[p.budget]; return c.startHi <= cap ? 'in' : c.startLo <= cap ? 'edge' : 'over'; }

// 화면에 보이는 시간 문구(h.time)에서 주당 시간 범위를 읽음. 문구에 주당 양이 없으면(반나절·하루·1박 등) 데이터의 hours를 씀
const _weekCache = {};
function weekHours(h){
  if (_weekCache[h.id]) return _weekCache[h.id];
  const N = '(\\d+(?:\\.\\d+)?)(?:~(\\d+(?:\\.\\d+)?))?';
  const dur = t => {
    let m = t.match(new RegExp('^' + N + '분~' + N + '시간$')); if (m) return [m[1] / 60, +(m[4] || m[3])];
    m = t.match(/^(\d+)시간 (\d+)분$/); if (m) return [+m[1] + m[2] / 60, +m[1] + m[2] / 60];
    m = t.match(new RegExp('^' + N + '시간( 이상)?$')); if (m) return [+m[1], +(m[2] || m[1])];
    m = t.match(new RegExp('^' + N + '분$')); if (m) return [m[1] / 60, (m[2] || m[1]) / 60];
    return null;
  };
  const per = (re, k) => { const m = h.time.match(re), d = m && dur(m[3]); return d ? [m[1] * d[0] * k, (m[2] || m[1]) * d[1] * k] : null; };
  let r = per(new RegExp('^주 ' + N + '회 · (.+)$'), 1) || per(new RegExp('^격주 ' + N + '회 · (.+)$'), 0.5) ||
          per(new RegExp('^(?:한 달|월) ' + N + '회 · (.+)$'), 12 / 52);
  if (!r) { const m = h.time.match(/^(?:하루|매일) (.+)$/), d = m && dur(m[1]); if (d) r = [7 * d[0], 7 * d[1]]; }
  if (!r) { const m = h.time.match(/^(?:주말|주|틈날 때 · 주) (.+)$/), d = m && dur(m[1]); if (d) r = d; }
  return (_weekCache[h.id] = r ? {lo: r[0], hi: r[1], fromText: true} : {lo: h.hours, hi: h.hours, fromText: false});
}
function timeFit(h, p){ const w = weekHours(h); return w.hi <= p.hours ? 'in' : w.lo <= p.hours ? 'edge' : 'over'; }

function profileFrom(answers){
  const sum = {}, cnt = {};
  const p = {u:{}, needs:[], hours:99, budget:4, stage:null, traitCount:0};
  answers.forEach((ai, qi) => {
    if (ai == null) return;
    const o = QUESTIONS[qi] && QUESTIONS[qi].o[ai];
    if (!o) return;
    if (o.v) { p.traitCount++; Object.keys(o.v).forEach(k => { sum[k] = (sum[k] || 0) + o.v[k]; cnt[k] = (cnt[k] || 0) + 1; }); }
    if (o.needs) p.needs = o.needs.slice();
    if (o.stage) p.stage = o.stage;
    if (o.hours != null) p.hours = o.hours;
    if (o.budget != null) p.budget = o.budget;
  });
  AXES.forEach(a => { p.u[a.k] = cnt[a.k] ? sum[a.k] / cnt[a.k] : 0.5; });
  p.cnt = cnt;
  return p;
}

function needMatch(h, p){ return p.needs.find(n => h.need.includes(n)) || null; }

function scoreHobby(h, p){
  let num = 0, den = 0;
  AXES.forEach(a => {
    if (!p.cnt[a.k]) return;  // 답에서 읽지 못한 성향은 가운데(0.5)로 치지 않고 계산에서 뺌
    const u = p.u[a.k], w = 0.35 + Math.abs(u - 0.5) * 2;
    num += w * (1 - Math.abs(u - h.v[a.k]));
    den += w;
  });
  let s = den ? num / den : 0.5;
  if (needMatch(h, p)) s += 0.05;
  if (budgetFit(h, p) === 'over') s -= 0.07 * (costLevel(costInfo(h).startLo) - p.budget);
  if (timeFit(h, p) === 'over') s -= 0.05;
  if (h.rare) s -= 0.03;
  return s;  // 순위는 자르지 않은 점수로 (0.99에서 잘라 동점이 생기던 문제)
}

function reasonsFor(h, p){
  const c = [];
  AXES.forEach(a => {
    const u = p.u[a.k], d = u - 0.5;
    if (Math.abs(d) < 0.15) return;
    const hv = h.v[a.k];
    if ((d > 0 && hv < 0.45) || (d < 0 && hv > 0.55)) return;
    c.push({t: d > 0 ? a.hi : a.lo, w: Math.abs(d) * (1 - Math.abs(u - hv))});
  });
  c.sort((x, y) => y.w - x.w);
  const out = c.slice(0, 2).map(x => x.t);
  const nm = needMatch(h, p);
  if (nm) out.push(NEEDS[nm]);
  if (out.length < 3 && p.budget < 4 && budgetFit(h, p) === 'in') out.push('예산 안에서 시작');
  if (out.length < 3 && p.hours < 99 && timeFit(h, p) === 'in') out.push('시간 여유 맞음');
  return out.slice(0, 3);
}

function fitsConstraints(h, p){ const b = budgetFit(h, p), t = timeFit(h, p); return b === 'over' || t === 'over' ? 0 : b === 'in' && t === 'in' ? 2 : 1; }
function constraintNotes(h, p){

function rankAll(p){
  // 예산·시간은 사용자가 밝힌 조건이라 먼저 맞는 것부터, 그 안에서 점수 순.
  // shortcut: 나이를 묻지 않아 술 관련 취미는 추천에서 빼고 둘러보기에서만 보여줌, 나이 확인을 넣으면 다시 검토
  return HOBBIES.filter(h => !h.adult).map(h => ({h, s: scoreHobby(h, p), fit: fitsConstraints(h, p)}))
    .sort((a, b) => (b.fit - a.fit) || (b.s - a.s) || (a.h.id < b.h.id ? -1 : 1));  // 점수까지 같으면 id 순: 데이터 순서를 바꿔도 결과가 같게
}

function pickDiverse(list, n, perCat){
  const out = [], cnt = {};
  for (const x of list) {
    if (out.length >= n) break;
    const c = x.h.cat;
    if ((cnt[c] || 0) >= perCat) continue;
    cnt[c] = (cnt[c] || 0) + 1;
    out.push(x);
  }
  return out;
}

function similarTo(h){
  // 술 관련 취미는 둘러보기에서만 보여주는 방침이라 비슷한 취미 추천에서도 뺌

  }).sort((a, b) => a.d - b.d).slice(0, 3).map(o => o.x);
}

function profileSentence(p){
  const ranked = AXES.map(a => ({a, d: p.u[a.k] - 0.5})).filter(o => Math.abs(o.d) >= 0.15)
    .sort((x, y) => Math.abs(y.d) - Math.abs(x.d)).slice(0, 2)
    .map(o => o.d > 0 ? o.a.hi : o.a.lo);
  let s = '';
  if (ranked.length === 2) s = '<b>' + ranked[0] + '</b>' + (hasBatchim(ranked[0]) ? '과' : '와') + ' <b>' + ranked[1] + '</b>' + (hasBatchim(ranked[1]) ? '을' : '를') + ' 좋아하는 편이에요.';
  else if (ranked.length === 1) s = '<b>' + ranked[0] + '</b>' + (hasBatchim(ranked[0]) ? '을' : '를') + ' 좋아하는 편이에요.';
  else s = '여러 방향에 고르게 열려 있는 편이에요.';
  if (p.needs.length) { const n = NEEDS[p.needs[0]]; s += ' 요즘은 <b>' + n + '</b>' + (hasBatchim(n) ? '이' : '가') + ' 필요해 보여요.'; }
  return s;
}

function buildResult(p){
  const ranked = rankAll(p);
  const top = pickDiverse(ranked, 3, 1);
  const topIds = top.map(x => x.h.id);
  const isFreshRare = x => x.h.rare && x.fit === 2 && !topIds.includes(x.h.id) && x.s >= 0.6;
  const surprise = ranked.find(x => isFreshRare(x) && !top.some(t => t.h.cat === x.h.cat)) || ranked.find(isFreshRare) || null;
  const used = topIds.concat(surprise ? [surprise.h.id] : []);
  const more = pickDiverse(ranked.filter(x => !used.includes(x.h.id)), 5, 1);
  return {ranked, top, surprise, more};
}

function shareResult(btn){
  const p = currentProfile(); if (!p) return;
  const names = buildResult(p).top.map((it, i) => (i + 1) + '. ' + it.h.name).join('\n');
  const url = /^https?:$/.test(location.protocol) ? location.origin + location.pathname : 'https://theserver62-glitch.github.io/naknak/';
  const t = typeOf(p), text = '낙낙 결과: ' + t.emoji + ' ' + t.name + '\n' + names + '\n\n나한테 맞는 취미는 뭘까?';
  bump('shared');
  const done = msg => { btn.textContent = msg; setTimeout(() => { btn.textContent = '내 결과 공유하기'; }, 2000); };
  if (navigator.share) { navigator.share({title: '낙낙 - 취미찾기', text, url}).catch(() => {}); return; }
  (navigator.clipboard ? navigator.clipboard.writeText(text + '\n' + url) : Promise.reject()).then(() => done('복사했어요. 붙여 넣어 보내 보세요'), () => done('공유를 지원하지 않는 브라우저예요'));
}
function bump(k, sub){
  if (sub) { ST[k] = asObj(ST[k]); ST[k][sub] = (Number(ST[k][sub]) || 0) + 1; } else ST[k] = (Number(ST[k]) || 0) + 1;
  lsSet(LS_STATS, ST);
}
function statsLine(){
  const L = asObj(ST.links), kinds = Object.keys(LINK_KIND).filter(k => Number(L[k]) > 0);
  const total = kinds.reduce((n, k) => n + Number(L[k]), 0);
  return '이 기기 기록: 질문 시작 ' + (Number(ST.started) || 0) + '번, 끝까지 ' + (Number(ST.completed) || 0) + '번, 상세 본 취미 ' + Object.keys(asObj(ST.seen)).length + '개, 바깥 링크 ' + total + '번' +
    (total ? ' (' + kinds.map(k => LINK_KIND[k] + ' ' + Number(L[k])).join(', ') + ')' : '');
}

const CAT_PREVIEW = 6;
function catBlocks(){
  return Object.keys(CATS).filter((c, i) => S.allCats || i < CAT_PREVIEW).map(c => {
    const list = byCat[c] || [];
    if (!list.length) return '';
    const open = !!S.openCats[c];
    const shown = open ? list : list.slice(0, CHIP_PREVIEW);
    return '<section class="cat-block" data-cat="' + CATS[c].fam + '">' +
      '<div class="cat-h"><span class="dot"></span><h3>' + CATS[c].label + '</h3><span class="cnt">' + list.length + '</span></div>' +
      '<div class="chips">' + shown.map(h => '<button class="chip-btn" data-act="hobby" data-id="' + h.id + '">' + esc(h.name) + (h.adult ? '<span class="rare-mark">19+</span>' : '') + '</button>').join('') + '</div>' +
      (list.length > CHIP_PREVIEW ? '<button class="more-btn" data-act="morecat" data-c="' + c + '" aria-expanded="' + open + '">' + (open ? '접기' : '+' + (list.length - CHIP_PREVIEW) + '개 더 보기') + '</button>' : '') +

}

function renderLive(){
  if (S.screen !== 'quiz') { liveSlot.innerHTML = ''; appEl.classList.remove('has-live'); return; }
  appEl.classList.add('has-live');
  const p = profileFrom(S.answers);
  let inner;
  if (p.traitCount < 1) {
    inner = '<div class="live-h"><span>지금까지 어울리는 낙</span></div><div class="live-empty">성향 질문에 답하기 시작하면 여기에 추천이 떠올라요.</div>';
    S.liveIds = [];
  } else {
    const top = pickDiverse(rankAll(p), 3, 1);
    const prev = S.liveIds;
    inner = '<div class="live-h"><span>지금까지 어울리는 낙</span><small>답할수록 또렷해져요</small></div><div class="live-row">' +
      top.map((x, i) => { const fresh = prev.length && !prev.includes(x.h.id);
        return '<button class="live-chip' + (fresh ? ' fresh' : '') + '" data-cat="' + fam(x.h) + '" data-act="hobby" data-id="' + x.h.id + '"><span class="ln">' + esc(x.h.name) + '</span><span class="lp">' + (i + 1) + '위' + (fresh ? ' · 새로 떠올랐어요' : '') + '</span></button>'; }).join('') + '</div>';
    S.liveIds = top.map(x => x.h.id);
  }
  liveSlot.innerHTML = '<aside class="live" aria-label="실시간 추천"><details class="live-d"' + (S.liveOpen ? ' open' : '') + '><summary>지금까지 어울리는 낙 보기</summary><div class="live-in">' + inner + '</div></details></aside>';
  setTimeout(() => liveSlot.querySelectorAll('.live-chip.fresh').forEach(el => el.classList.remove('fresh')), 900);
}

/* result */
function ticket(item, i, p, rare){
  const h = item.h, why = reasonsFor(h, p), warn = constraintNotes(h, p);
  return '<button class="ticket' + (rare ? ' rare' : '') + '" data-cat="' + fam(h) + '" data-act="hobby" data-id="' + h.id + '">' +
    '<div class="t-main"><span class="t-cat"><span class="dot"></span>' + CATS[h.cat].label + '</span>' +
      '<span class="t-name">' + esc(h.name) + '</span><span class="t-tag">' + esc(h.tag) + '</span>' +
      '<span class="t-why">' + warn.map(w => '<span class="tag warn">' + esc(w) + '</span>').join('') + why.map(w => '<span class="tag">' + esc(w) + '</span>').join('') + '</span></div>' +
    '<div class="t-stub">' + (rare ? '<span class="t-lab">숨은 취미</span><span class="t-pct word">의외의<br>발견</span>' : '<span class="t-pct">' + (i + 1) + '</span><span class="t-lab">순위</span>') + '</div>' +
  '</button>';
}

function renderResult(){
  const p = currentProfile();
  if (!p) { S.screen = 'home'; return renderHome(); }
  const R = buildResult(p);
  const stage = STAGES[p.stage] || STAGES.worker;
  if (!stage.tabs.includes(S.tab)) S.tab = 'all';
  let tabBody;
  if (S.tab === 'all') {
    tabBody = '<div class="tickets">' + R.top.map((it, i) => ticket(it, i, p, false)).join('') + '</div>' +
      (R.surprise ? '<div class="surprise"><div class="surprise-h"><b>의외의 발견</b><span>잘 안 알려졌지만 나와 맞는 숨은 취미</span></div>' + ticket(R.surprise, 0, p, true) + '</div>' : '');
  } else {
    const rule = TAB_RULES[S.tab];
    const list = pickDiverse(R.ranked.filter(x => rule.test(x.h)), 3, 1);
    tabBody = '<p class="tab-note">' + rule.note + '</p>' +
      (list.length ? '<div class="tickets">' + list.map((it, i) => ticket(it, i, p, false)).join('') + '</div>' : '<p class="tab-note">조건에 맞는 취미가 아직 없어요.</p>');
  }
  return bar('결과') +
  '<section class="result">' +
    (S.sample ? '<div class="sample-note">예시 답변으로 만든 결과예요. 직접 해보려면 아래 <b>다시 해보기</b>를 눌러주세요.</div>' : '') +
    '<div class="r-head"><p class="eyebrow">' + (S.sample ? '예시 결과' : '나의 결과') + ' · ' + esc(stage.label) + '</p>' +
      '<div class="type-emo" aria-hidden="true">' + typeOf(p).emoji + '</div><h1 class="r-title">' + esc(typeOf(p).name) + '</h1>' +
      '<p class="type-desc">' + esc(typeOf(p).desc) + '</p>' +
    '<p class="r-sum">' + profileSentence(p) + '</p></div>' +
    '<h2 class="sec-h">낙낙 입장권 3장이 나왔어요</h2>' +
    '<div class="tab-block"><div class="tabs" role="tablist" aria-label="결과 보기">' + stage.tabs.map(t =>
      '<button class="tab" role="tab" id="tab-' + t + '" data-act="tab" data-t="' + t + '" aria-selected="' + (S.tab === t) + '">' + TAB_RULES[t].label + '</button>').join('') + '</div>' +
      '<div role="tabpanel" aria-labelledby="tab-' + S.tab + '" class="tab-block">' + tabBody + '</div></div>' +
    '<div><h2 class="sec-h">나의 취미 성향</h2><div class="spec-list">' + AXES.map(a => {
      const u = p.u[a.k];
      if (!p.cnt[a.k]) return '<div class="spec"><span>' + a.l + '</span><div class="track unk" role="img" aria-label="' + a.l + '·' + a.r + ' 답에서 읽지 못했어요"><em>답에서 읽지 못했어요</em></div><span class="r">' + a.r + '</span></div>';
      return '<div class="spec"><span class="' + (u < 0.4 ? 'lean' : '') + '">' + a.l + '</span><div class="track" role="img" aria-label="' + a.l + ' ' + Math.round((1 - u) * 100) + ', ' + a.r + ' ' + Math.round(u * 100) + '"><span class="knob" style="left:' + (u * 100).toFixed(1) + '%"></span></div><span class="r ' + (u > 0.6 ? 'lean' : '') + '">' + a.r + '</span></div>';
    }).join('') + '</div>' + (AXES.some(a => !p.cnt[a.k]) ? '<p class="spec-note">답에서 읽지 못한 성향은 추천 계산에서 빼고 계산했어요.</p>' : '') + '</div>' +
    '<div><h2 class="sec-h">이것도 잘 맞아요</h2><div class="rows">' + R.more.map(it =>
      '<button class="row" data-cat="' + fam(it.h) + '" data-act="hobby" data-id="' + it.h.id + '"><span class="dot"></span><span style="min-width:0"><span class="rn">' + esc(it.h.name) + '</span><span class="rt">' + esc(CATS[it.h.cat].label + ' · ' + it.h.tag) + '</span></span></button>').join('') + '</div></div>' +
    '<button class="btn primary block" data-act="share">내 결과 공유하기</button>' +
    renderFeedback() +

  '</section>';
}

  if (type === '유튜브') return 'https://www.youtube.com/results?search_query=' + encodeURIComponent(title);
  return 'https://search.naver.com/search.naver?query=' + encodeURIComponent(title + (type === '앱' || type === '사이트' || type === '서비스' ? '' : ' ' + type));

      '<small>' + esc((ci.parts.length ? ci.parts.join(' + ') + ' · ' : '') + keepCostText(ci)) + '</small></div>' +
    '</div>' +
    (h.g.some(g => buyLink(h, g[0])) ? '<p class="disclose">이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</p>' : '') +
    '<p class="sub" style="margin:0">가격은 2026년 10월에 일부만 확인한 대략적인 범위예요. 안전·규정 정보는 아직 검수 전이에요. 시작 전에 업체나 공식 기관에서 확인해 주세요.</p>' +
    '</section>' +

    '<section class="sec"><h2>비슷한 취미</h2><div class="similar">' + similarTo(h).map(chip).join('') + '</div></section>' +
  '</article>';
}

/* browse */
function renderBrowse(){
  const fs = [['all','전체']].concat(Object.keys(CATS).map(c => [c, CATS[c].label])).concat([['rare','숨은 취미']]);
  return bar('어떤 취미가 있을까', HOBBIES.length + '개') +
  '<section class="browse">' +
    '<input class="field search" id="browse-q" type="search" autocomplete="off" placeholder="취미 이름으로 찾기 (예: 한지, 피규어)" value="' + esc(S.q) + '" aria-label="취미 검색">' +
    '<div class="filters" role="group" aria-label="분류">' + fs.filter((f, i) => S.allCats || i < CAT_PREVIEW || S.filter === f[0]).map(f => '<button class="f-btn" data-act="filter" data-f="' + f[0] + '" aria-pressed="' + (S.filter === f[0]) + '">' + f[1] + '</button>').join('') +
      '<button class="f-btn more-cats" data-act="allcats" aria-expanded="' + !!S.allCats + '">' + (S.allCats ? '분류 접기' : '분류 더 보기') + '</button></div>' +
    '<div id="browse-list">' + browseList() + '</div>' +
  '</section>';
}
function card(h){
  return '<button class="card" data-cat="' + fam(h) + '" data-act="hobby" data-id="' + h.id + '">' + (h.adult ? '<span class="cr">19+</span>' : h.rare ? '<span class="cr">숨은</span>' : '') + '<span class="cn">' + esc(h.name) + '</span><span class="ct">' + esc(h.tag) + '</span><span class="cc">시작 비용 ' + esc(costInfo(h).label) + '</span></button>';
}
function norm(s){ return String(s).replace(/\s+/g, '').toLowerCase(); }
function browseList(){
  const q = norm(S.q);
  let list = HOBBIES.filter(h => S.filter === 'all' || (S.filter === 'rare' ? h.rare : h.cat === S.filter));
  if (q) list = list.filter(h => norm(h.name + h.tag + CATS[h.cat].label).includes(q));
  if (!list.length) return '<p class="empty">‘' + esc(S.q) + '’에 맞는 취미가 아직 없어요. 결과 화면 피드백으로 알려주시면 추가할게요.</p>';
  if (S.filter === 'all' && !q) {
    return '<p class="result-count">카테고리를 고르거나 이름으로 검색해보세요.</p><div class="cats">' + catBlocks() + '</div>' +
      (S.allCats ? '' : '<button class="btn block" data-act="allcats" aria-expanded="false">분류 ' + (Object.keys(CATS).length - CAT_PREVIEW) + '개 더 보기</button>');
  }
  return '<p class="result-count">' + list.length + '개</p><div class="grid">' + list.map(card).join('') + '</div>';
}

function render(toTop){
  let html = '';
  if (S.screen === 'quiz') html = renderQuiz();
  else if (S.screen === 'result') html = renderResult();
  else if (S.screen === 'detail' && byId[S.hobby]) html = renderDetail();
  else if (S.screen === 'browse') html = renderBrowse();
  else { S.screen = 'home'; html = renderHome(); }
  view.innerHTML = html;
  renderLive();
  if (toTop) {
    window.scrollTo(0, 0);
    const t = view.querySelector('h1') || view.querySelector('.bar-title');
    if (t) { t.tabIndex = -1; t.focus({preventScroll: true}); }
  }
}

// 앞으로 가는 이동마다 브라우저 기록을 하나 쌓아, 폰의 뒤로가기가 앱 밖으로 나가지 않고 앞 화면으로 돌아오게 함
function nav(patch){
  stack.push({screen: S.screen, hobby: S.hobby, qi: S.qi, sample: S.sample});
  try { history.pushState({nk: stack.length}, ''); } catch(e){}
  Object.assign(S, patch);
}
function go(screen, patch){ nav(Object.assign({}, patch, {screen})); render(true); }
function popTo(n){
  let prev; while (stack.length > n) prev = stack.pop();
  if (prev) { Object.assign(S, prev); render(true); }
}
function back(){
  if (history.state && history.state.nk === stack.length && stack.length) history.back();  // popstate가 되돌림
  else if (stack.length) popTo(stack.length - 1);
  else { S.screen = 'home'; render(true); }
}
window.addEventListener('popstate', e => { const n = (e.state && e.state.nk) || 0; if (n < stack.length) popTo(n); });

function copyFeedback(){
  const text = feedbackText();
  const status = document.getElementById('fb-status');
  const out = document.getElementById('fb-out');
  const ok = () => { status.hidden = false; status.textContent = '복사했어요. 카톡이나 문자에 붙여넣어 보내주세요.'; out.hidden = true; };
  const fallback = () => {
    out.hidden = false; out.value = text; out.style.minHeight = '180px';
    out.focus(); out.select();
    status.hidden = false; status.textContent = '자동 복사가 안 돼요. 아래 글을 길게 눌러 복사해주세요.';
  };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fallback);
    else fallback();
  } catch(e){ fallback(); }
}

function keepScroll(fn){ const y = window.scrollY; fn(); window.scrollTo(0, y); }

function onClick(e){
  const el = e.target.closest('[data-act]');
  if (!el || el.dataset.act === 'check') return;
  const act = el.dataset.act;
  if (act === 'share') { shareResult(el); return; }
  if (act === 'start' || act === 'retry') { bump('started'); go('quiz', {qi:0, answers:[], sample:false, tab:'all', liveIds:[]}); }
  else if (act === 'sample') { go('result', {sample:true, tab:'all'}); }
  else if (act === 'last') { const a = loadLast(); if (a) go('result', {result:a, sample:false, tab:'all'}); }
  else if (act === 'browse') { go('browse'); }
  else if (act === 'back') { back(); }
  else if (act === 'hobby') { bump('seen', el.dataset.id); go('detail', {hobby: el.dataset.id}); }
  else if (act === 'filter') { S.filter = el.dataset.f; keepScroll(() => render(false)); }
  else if (act === 'allcats') { S.allCats = !S.allCats; keepScroll(() => render(false)); }
  else if (act === 'morecat') { const c = el.dataset.c; S.openCats[c] = !S.openCats[c]; keepScroll(() => render(false)); }
  else if (act === 'tab') { S.tab = el.dataset.t; keepScroll(() => render(false)); }
  else if (act === 'want') {
    const id = S.hobby;
    S.wants = S.wants.includes(id) ? S.wants.filter(x => x !== id) : S.wants.concat(id);
    lsSet(LS_WANTS, S.wants);
    const on = S.wants.includes(id);
    el.setAttribute('aria-pressed', String(on));
    el.querySelector('span').textContent = on ? '해보고 싶어요 · 찜했어요' : '해보고 싶어요';
  }
  else if (act === 'rate') {
    S.fb.rate = Number(el.dataset.n);
    view.querySelectorAll('[data-act="rate"]').forEach(b => b.setAttribute('aria-pressed', String(b === el)));
  }
  else if (act === 'week') {
    S.fb.week = el.dataset.v;
    view.querySelectorAll('[data-act="week"]').forEach(b => b.setAttribute('aria-pressed', String(b === el)));
  }
  else if (act === 'copyfb') { copyFeedback(); }
  else if (act === 'opt') {
    if (S.busy) return;
    S.answers[S.qi] = Number(el.dataset.i);
    view.querySelectorAll('.opt').forEach(b => b.setAttribute('aria-pressed', String(b === el)));
    renderLive();
    const hint = view.querySelector('.q-hint');
    if (hint) { hint.textContent = REACT[S.qi % REACT.length]; hint.classList.add('react'); }
    S.busy = true;
    setTimeout(() => {
      S.busy = false;
      if (S.qi < QUESTIONS.length - 1) { nav({qi: S.qi + 1}); render(true); }
      else { S.result = S.answers.slice(); lsSet(LS_LAST, S.result); S.fb.rate = 0; S.fb.week = ''; bump('completed'); nav({screen:'result', sample:false, tab:'all'}); render(true); }
    }, 260);
  }
}
view.addEventListener('click', onClick);
view.addEventListener('toggle', e => { if (e.target.matches && e.target.matches('.fb-details')) S.fbOpen = e.target.open; }, true);
view.addEventListener('click', e => { const a = e.target.closest('a[data-kind]'); if (a) bump('links', a.dataset.kind); });
liveSlot.addEventListener('click', onClick);
liveSlot.addEventListener('toggle', e => { if (e.target.matches && e.target.matches('.live-d')) S.liveOpen = e.target.open; }, true);
view.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset && el.dataset.act === 'check') {
    const arr = Array.isArray(S.checks[S.hobby]) ? S.checks[S.hobby] : (S.checks[S.hobby] = []);
    arr[Number(el.dataset.i)] = el.checked;
    lsSet(LS_CHECKS, S.checks);
  }
});
view.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'browse-q') {
    S.q = t.value;
    const box = document.getElementById('browse-list');
    if (box) box.innerHTML = browseList();
    return;
  }
  const k = t.dataset && t.dataset.fb;
  if (k) S.fb[k] = t.value;
});

function start(data){
  if (data && data.S) { S = Object.assign(S, data.S, {busy:false}); stack = data.stack || []; }
  try { history.replaceState({nk: stack.length}, ''); } catch(e){}
  render(false);
}
if (window.claude && window.claude.hot && typeof window.claude.hot.snapshot === 'function') {
  window.claude.hot.snapshot(() => ({S, stack}));
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});

</script>

<script>if('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
</body>
