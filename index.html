<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>낙낙 - 취미찾기</title>
<meta name="description" content="질문 12개에 답하면 지금의 나에게 맞는 취미를 219개 중에서 골라 드려요. 시작하는 법, 준비물, 시작 비용까지.">
<meta property="og:type" content="website">
<meta property="og:title" content="낙낙 - 취미찾기">
<meta property="og:description" content="질문 12개에 답하면 지금의 나에게 맞는 취미를 219개 중에서 골라 드려요. 시작하는 법, 준비물, 시작 비용까지.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B1%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2C47DB">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>body{margin:0}</style>
</head>
<body>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  /* Layout: one-column app shell (max 560px); screens swap in place; the ticket is the only loud element */
  --bg:#EDF0F5;
  --surface:#FFFFFF;
  --surface-2:#F4F6FA;
  --ink:#141830;
  --muted:#596079;
  --line:#D5DBE6;
  --accent:#2C47DB;
  --accent-ink:#FFFFFF;
  --accent-soft:#E3E8FF;
  --want:#D42F4C; --want-soft:#FDE6EA;
  --c-move:#2C47DB; --c-move-ink:#FFFFFF;
  --c-make:#F2A900; --c-make-ink:#1F1700;
  --c-think:#7448D4; --c-think-ink:#FFFFFF;
  --c-nature:#23855A; --c-nature-ink:#FFFFFF;
  --note-bg:#FFF7DD; --note-line:#D9AE36; --note-ink:#574200;
  --shadow:0 1px 2px rgba(20,24,48,.06),0 8px 20px rgba(20,24,48,.07);
  --shadow-up:0 -6px 24px rgba(20,24,48,.10);
  --scrim:rgba(237,240,245,.88);
  --f-display:"Bagel Fat One","Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --fs-12:12px;--fs-14:14px;--fs-16:16px;--fs-18:18px;--fs-22:22px;--fs-28:28px;
  --f-mono:var(--f-body);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F121B; --band:#0F121B; --surface:#181C29; --surface-2:#1E2333; --ink:#E8EBF4; --muted:#9BA2B8; --line:#2A3043;
    --accent:#8095FF; --accent-ink:#0B0E1A; --accent-soft:#222A4D;
    --want:#FF7A90; --want-soft:#3A1C24;
    --c-move:#8095FF; --c-move-ink:#0B0E1A; --c-make:#FFC53D; --c-make-ink:#1F1700;
    --c-think:#B396FF; --c-think-ink:#140B2A; --c-nature:#5BCB8E; --c-nature-ink:#06180F;
    --note-bg:#2A2410; --note-line:#8C7228; --note-ink:#F1D88A;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 20px rgba(0,0,0,.25);
    --shadow-up:0 -6px 24px rgba(0,0,0,.35);
    --scrim:rgba(15,18,27,.88);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F121B; --band:#0F121B; --surface:#181C29; --surface-2:#1E2333; --ink:#E8EBF4; --muted:#9BA2B8; --line:#2A3043;
  --accent:#8095FF; --accent-ink:#0B0E1A; --accent-soft:#222A4D;
  --want:#FF7A90; --want-soft:#3A1C24;
  --c-move:#8095FF; --c-move-ink:#0B0E1A; --c-make:#FFC53D; --c-make-ink:#1F1700;
  --c-think:#B396FF; --c-think-ink:#140B2A; --c-nature:#5BCB8E; --c-nature-ink:#06180F;
  --note-bg:#2A2410; --note-line:#8C7228; --note-ink:#F1D88A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 20px rgba(0,0,0,.25);
  --shadow-up:0 -6px 24px rgba(0,0,0,.35);
  --scrim:rgba(15,18,27,.88);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:var(--fs-16);line-height:1.6;word-break:keep-all;overflow-wrap:anywhere;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 calc(56px + env(safe-area-inset-bottom,0px))}
.app.has-live{padding-block-end:calc(150px + env(safe-area-inset-bottom,0px))}

[data-cat="move"]{--cat:var(--c-move);--cat-ink:var(--c-move-ink)}
[data-cat="make"]{--cat:var(--c-make);--cat-ink:var(--c-make-ink)}
[data-cat="think"]{--cat:var(--c-think);--cat-ink:var(--c-think-ink)}
[data-cat="nature"]{--cat:var(--c-nature);--cat-ink:var(--c-nature-ink)}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;margin-inline:-16px;padding-inline:8px 16px;background:var(--scrim);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.bar-row{display:flex;align-items:center;gap:6px;min-height:52px}
.bar-title{font-weight:600;font-size:var(--fs-16);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-end{margin-left:auto;font-family:var(--f-mono);font-size:var(--fs-14);color:var(--muted);font-variant-numeric:tabular-nums}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border:0;background:transparent;border-radius:10px;cursor:pointer}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.prog{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:0 0 10px 8px}
.prog i{height:4px;border-radius:2px;background:var(--line)}
.prog i.on{background:var(--accent)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:var(--fs-16);cursor:pointer;text-decoration:none;color:var(--ink);text-align:center}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.block{width:100%}
.btn .sub{font-weight:600;opacity:.8;font-size:var(--fs-14)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* home */
.home{display:grid;gap:22px;padding-top:36px}
.brand{font-weight:700;font-size:var(--fs-14);letter-spacing:-.01em;color:var(--muted)}
.brand b{font-family:var(--f-display);font-weight:400;font-size:var(--fs-18);letter-spacing:0;color:var(--ink);margin-right:6px}
.hero-title{font-family:var(--f-display);font-weight:400;font-size:var(--fs-28);line-height:1.18;margin:0;letter-spacing:-.01em;text-wrap:balance}
.lede{margin:0;color:var(--muted);max-width:34em}
.stack{position:relative;height:226px}
.mini{position:absolute;width:min(330px,88%);display:grid;grid-template-columns:minmax(0,1fr) 74px;background:var(--surface);border-radius:14px;box-shadow:var(--shadow)}
.mini:nth-child(1){top:0;left:2%;transform:rotate(-4deg)}
.mini:nth-child(2){top:76px;left:9%;transform:rotate(2.5deg)}
.mini:nth-child(3){top:150px;left:3%;transform:rotate(-1.2deg)}
.mini .mm{padding:12px 16px;min-width:0}
.mini .mn{font-family:var(--f-display);font-size:var(--fs-22);line-height:1.2}
.mini .mt{font-size:var(--fs-12);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .ms{background:var(--cat);color:var(--cat-ink);border-radius:0 14px 14px 0;border-left:3px dotted var(--surface);display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:600;font-size:var(--fs-18);font-variant-numeric:tabular-nums}
.cta{display:grid;gap:10px}
.modes{display:grid;gap:8px}
.modes .btn{flex-direction:column;gap:2px;padding:10px 16px}
.modes .btn .sub{font-size:var(--fs-14)}
.flat-hint{margin:8px 0 0;font-size:var(--fs-14);color:var(--muted)}
.flat-hint .link-btn{font-size:inherit;padding:0;min-height:0;vertical-align:baseline}
.why-box{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:14px 16px}
.why-box ul{margin:8px 0 0;padding-left:20px;display:grid;gap:4px;font-size:var(--fs-16)}
.why-box .why-src{margin:8px 0 0;font-size:var(--fs-12);color:var(--muted)}
.peek h2{font-size:var(--fs-14);font-weight:600;color:var(--muted);margin:0 0 10px;letter-spacing:-.01em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip-btn{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:var(--fs-14);cursor:pointer}
.chip-btn:hover{border-color:var(--muted)}
.chip-btn .rare-mark{font-size:var(--fs-12);font-weight:700;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--cat);flex:none}
.foot{font-size:var(--fs-12);color:var(--muted);margin:0;border-top:1px solid var(--line);padding-top:16px}

/* quiz */
.quiz{display:grid;gap:20px;padding-top:20px}
.q-num{font-family:var(--f-mono);font-size:var(--fs-14);color:var(--accent);font-weight:600}
.q-text{font-size:var(--fs-28);font-weight:700;line-height:1.35;margin:4px 0 0;text-wrap:balance}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;padding:16px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;font-weight:600;font-size:var(--fs-16);line-height:1.4;text-align:left;cursor:pointer;transition:border-color .15s ease-out,background .15s ease-out}
.opt:hover{border-color:var(--muted)}
.opt .ring{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] .ring{border-color:var(--accent)}
.opt[aria-pressed="true"] .ring::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
.q-hint{font-size:var(--fs-14);color:var(--muted);margin:0}
.sky{height:56px;border-radius:12px;background:var(--line) right bottom/auto 100% no-repeat}
.q-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start}
.q-scene{margin:0;font-size:var(--fs-16);color:var(--muted)}
.q-scene .q-num{display:inline}
.q-art{width:88px;height:88px;margin-top:4px}
.opt .nick{margin-left:auto;padding-left:8px;flex:none;font-weight:500;font-size:var(--fs-14);color:var(--muted)}
.opts.tiles{grid-template-columns:1fr 1fr}
.opt.tile{flex-direction:column;justify-content:flex-start;gap:8px;padding:12px;text-align:center}
.opt.tile img{width:88px;height:88px}
.opt.tile .ring{display:none}
.opt.tile[aria-pressed="true"]{border-color:var(--accent)}
.opts.tiles .opt.wide{grid-column:1/-1}
@media (max-height:700px){.quiz{gap:12px;padding-top:8px}.sky{height:32px}.q-art{width:56px;height:56px}.opts{gap:8px}.opt{padding:11px 14px;min-height:48px}.opt.tile{padding:8px;gap:4px}.opt.tile img{width:56px;height:56px}.q-text{font-size:var(--fs-22)}}

/* live recommendations */
.live{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);box-shadow:var(--shadow-up);border-top:1px solid var(--line);padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.live-in{max-width:528px;margin:0 auto;display:grid;gap:8px}
.live-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:var(--fs-12);font-weight:600;color:var(--muted)}
.live-h small{font-weight:600;font-size:var(--fs-12)}
.live-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.live-chip{display:grid;gap:0;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);text-align:left;cursor:pointer;min-width:0;position:relative;overflow:hidden;transition:background .4s ease-out}
.live-chip::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--cat)}
.live-chip .ln{font-weight:600;font-size:var(--fs-14);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live-chip .lp{font-family:var(--f-mono);font-size:var(--fs-12);color:var(--muted);font-variant-numeric:tabular-nums}
.live-chip.fresh{background:var(--accent-soft)}
.live-empty{font-size:var(--fs-14);color:var(--muted);padding:6px 0}

/* result */
.result{display:grid;gap:26px;padding-top:20px}
.eyebrow{font-size:var(--fs-14);font-weight:600;color:var(--accent);margin:0 0 6px}
.r-title{font-family:var(--f-display);font-weight:400;font-size:var(--fs-28);line-height:1.2;margin:0;text-wrap:balance}
.r-sum{margin:10px 0 0;color:var(--muted)}
.r-sum b{color:var(--ink);font-weight:600}
.sample-note{padding:12px 14px;border-radius:12px;background:var(--accent-soft);font-size:var(--fs-14)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:var(--fs-14);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tab-note{margin:-6px 0 0;font-size:var(--fs-14);color:var(--muted)}
.tab-block{display:grid;gap:14px}
.tickets{display:grid;gap:14px}
.ticket{display:grid;grid-template-columns:minmax(0,1fr) 92px;width:100%;text-align:left;background:var(--surface);border:0;border-radius:16px;padding:0;cursor:pointer;position:relative;box-shadow:var(--shadow);transition:transform .15s ease-out}
.ticket:hover{transform:translateY(-2px)}
.ticket::before,.ticket::after{content:"";position:absolute;right:92px;width:18px;height:18px;border-radius:50%;background:var(--bg);transform:translateX(50%)}
.ticket::before{top:-9px}
.ticket::after{bottom:-9px}
.t-main{padding:18px 20px 18px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.t-cat{font-size:var(--fs-12);font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
.t-name{font-family:var(--f-display);font-size:var(--fs-28);line-height:1.15}
.t-tag{font-size:var(--fs-14);color:var(--muted)}
.t-why{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tag{font-size:var(--fs-12);font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.tag.warn{background:var(--note-bg);border-color:var(--note-line);color:var(--note-ink)}
.t-stub{background:var(--cat);color:var(--cat-ink);border-radius:0 16px 16px 0;border-left:3px dotted var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:12px 6px;text-align:center}
.t-rank{font-size:var(--fs-12);font-weight:600;opacity:.85}
.t-pct{font-family:var(--f-display);font-weight:400;font-size:var(--fs-28);line-height:1;font-variant-numeric:tabular-nums}
.t-pct.word{font-family:var(--f-body);font-size:var(--fs-16);line-height:1.25;text-align:center}
.t-pct small{font-size:var(--fs-14)}
.t-lab{font-size:var(--fs-12);opacity:.85}
.surprise{display:grid;gap:10px}
.surprise-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.surprise-h b{font-size:var(--fs-16)}
.surprise-h span{font-size:var(--fs-14);color:var(--muted)}
.ticket.rare{background:var(--surface);outline:2px dashed var(--cat);outline-offset:-2px;box-shadow:none}
.sec-h{font-size:var(--fs-18);font-weight:700;margin:0 0 12px}
.spec-list{display:grid;gap:14px;background:var(--surface);border-radius:16px;padding:18px}
.spec{display:grid;grid-template-columns:4.6em minmax(0,1fr) 4.6em;align-items:center;gap:10px;font-size:var(--fs-14)}
.spec span{color:var(--muted)}
.spec span.lean{color:var(--ink);font-weight:600}
.spec .r{text-align:right}
.track{position:relative;height:6px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line)}
.track::before{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:1px;background:var(--line)}
.track.unk{border-style:dashed;background:transparent;height:auto;min-height:22px;display:flex;align-items:center;justify-content:center}
.track.unk::before{display:none}
.track.unk em{font-style:normal;font-size:var(--fs-12);color:var(--muted)}
.spec-note{font-size:var(--fs-12);color:var(--muted);margin:8px 2px 0}
.fact dd small{display:block;font-size:var(--fs-12);color:var(--muted);font-weight:400;margin-top:2px}
.choice{display:grid;gap:6px}
.choice button{min-height:44px;text-align:left;padding:10px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface-2);font-size:var(--fs-14);cursor:pointer;color:var(--ink)}
.choice button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.knob{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:var(--accent);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--accent);transform:translate(-50%,-50%)}
.rows{display:grid;gap:8px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;cursor:pointer;text-align:left}
.row:hover{border-color:var(--muted)}
.row .rn{font-weight:600}
.row .rt{font-size:var(--fs-14);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.row .rp{font-family:var(--f-mono);font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted)}

/* feedback */
.feedback{display:grid;gap:16px;padding:20px 18px;background:var(--surface);border-radius:16px;border:1.5px dashed var(--line)}
.feedback h2{margin:0;font-size:var(--fs-18)}
.feedback .sub{margin:-10px 0 0;font-size:var(--fs-14);color:var(--muted)}
.fb-q{display:grid;gap:8px}
.fb-q > label,.fb-q > .fb-label{font-weight:600;font-size:var(--fs-14)}
.rate{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rate button{min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface-2);font-family:var(--f-mono);font-weight:600;cursor:pointer}
.rate button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rate-legend{display:flex;justify-content:space-between;font-size:var(--fs-12);color:var(--muted)}
.fb-wants{font-size:var(--fs-14);color:var(--muted)}
.fb-wants b{color:var(--ink)}
.field{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);font-size:var(--fs-16)}
.field:focus{outline:none;border-color:var(--accent)}
textarea.field{min-height:84px;resize:vertical}
.fb-status{font-size:var(--fs-14);color:var(--accent);font-weight:600;margin:0}

/* detail */
.detail{display:grid;padding-top:16px}
.d-head{display:grid;gap:12px;padding-bottom:22px}
.d-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.d-cat{display:inline-flex;align-items:center;gap:8px;padding:4px 12px 4px 10px;border-radius:999px;background:var(--cat);color:var(--cat-ink);font-size:var(--fs-14);font-weight:600}
.d-cat .dot{background:var(--cat-ink)}
.d-rare{font-size:var(--fs-12);font-weight:600;color:var(--muted);border:1px dashed var(--line);border-radius:999px;padding:3px 10px}
.d-name{font-family:var(--f-display);font-weight:400;font-size:var(--fs-28);line-height:1.1;margin:0}
.d-tag{margin:0;font-size:var(--fs-16);color:var(--muted)}
.d-fit{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:var(--fs-14)}
.d-fit .pct{font-family:var(--f-mono);font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.want-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;border:1.5px solid var(--want);background:var(--surface);color:var(--want);font-weight:700;cursor:pointer}
.want-btn svg{width:20px;height:20px;stroke:currentColor;stroke-width:2;fill:none}
.want-btn[aria-pressed="true"]{background:var(--want);color:var(--surface)}
.want-btn[aria-pressed="true"] svg{fill:currentColor}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:0}
.fact{background:var(--surface);padding:12px 14px;min-width:0}
.fact dt{font-size:var(--fs-12);color:var(--muted);margin:0}
.fact dd{margin:2px 0 0;font-weight:600;font-size:var(--fs-14);font-variant-numeric:tabular-nums}
.sec{display:grid;gap:14px;padding-block:24px;border-top:1px solid var(--line)}
.sec h2{font-size:var(--fs-18);font-weight:700;margin:0}
.sec .sub{margin:-8px 0 0;font-size:var(--fs-14);color:var(--muted)}
.why{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.why li{display:grid;grid-template-columns:10px minmax(0,1fr);gap:12px;align-items:start}
.why li::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--cat);margin-top:.55em}
.steps{list-style:none;margin:0;padding:0;display:grid;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;padding-bottom:16px;position:relative}
.steps li::before{content:counter(s);width:30px;height:30px;border-radius:50%;background:var(--surface);border:1.5px solid var(--cat);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:var(--fs-14)}
.steps li:not(:last-child)::after{content:"";position:absolute;left:14.5px;top:32px;bottom:2px;width:1.5px;background:var(--line)}
.steps li span{padding-top:3px}
.gear{display:grid;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.g-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 14px;border-top:1px solid var(--line)}
.g-row:first-child{border-top:0}
.g-name{font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.g-note{grid-column:1/-1;font-size:var(--fs-14);color:var(--muted);margin-top:-2px}
.g-price{font-family:var(--f-mono);font-weight:600;font-size:var(--fs-14);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.req{font-size:var(--fs-12);font-weight:600;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.opt-tag{font-size:var(--fs-12);font-weight:600;padding:0 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.g-buy{grid-column:1/-1;justify-self:start;font-size:var(--fs-14);font-weight:600;color:var(--accent);text-decoration:none;display:inline-flex;align-items:center;gap:6px;min-height:32px}
.ad-tag{font-size:var(--fs-12);font-weight:600;padding:0 6px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.disclose{margin:10px 0 6px;font-size:var(--fs-14);color:var(--muted);padding:8px 12px;border-radius:10px;background:var(--surface)}
.g-sum{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:14px;background:var(--surface-2);border-top:1px solid var(--line);font-weight:700}
.g-sum .g-price{font-weight:600}
.g-sum small{grid-column:1/-1;font-weight:600;font-size:var(--fs-14);color:var(--muted)}
.memo{border:1.5px dashed var(--note-line);background:var(--note-bg);color:var(--note-ink);border-radius:12px;padding:12px 14px;font-size:var(--fs-14)}
.checks{display:grid;gap:8px}
.check{display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;align-items:start;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer}
.check input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent)}
.check input:checked + span{color:var(--muted);text-decoration:line-through}
.media{display:grid;gap:10px}
.m-card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:start;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;text-decoration:none;color:var(--ink)}
.m-card:hover{border-color:var(--muted)}
.m-type{font-size:var(--fs-12);font-weight:600;color:var(--muted);letter-spacing:-.01em}
.m-title{font-weight:700;font-size:var(--fs-16);grid-column:1}
.m-desc{font-size:var(--fs-14);color:var(--muted);grid-column:1/-1}
.m-arrow{grid-row:1/3;grid-column:2;color:var(--muted);font-size:var(--fs-18);line-height:1}
.similar{display:flex;flex-wrap:wrap;gap:8px}

/* browse */
.browse{display:grid;gap:18px;padding-top:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{display:flex;flex-direction:column;gap:6px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;text-align:left;cursor:pointer;position:relative;overflow:hidden;min-width:0}
.card::before{content:"";position:absolute;left:0;top:0;right:0;height:5px;background:var(--cat)}
.card:hover{border-color:var(--muted)}
.card .cn{font-family:var(--f-display);font-size:var(--fs-22);line-height:1.2;margin-top:4px;padding-right:28px}
.card .ct{font-size:var(--fs-14);color:var(--muted);line-height:1.5}
.card .cc{margin-top:auto;padding-top:6px;font-family:var(--f-mono);font-size:var(--fs-12);color:var(--muted);font-variant-numeric:tabular-nums}
.card .cr{position:absolute;top:12px;right:12px;font-size:var(--fs-12);font-weight:700;color:var(--muted)}

.d-badges{display:flex;gap:6px;flex-wrap:wrap}
.link-btn{justify-self:center;border:0;background:none;padding:8px 12px;color:var(--accent);font-weight:600;font-size:var(--fs-16);cursor:pointer}
.golinks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.golink{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:start;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;text-decoration:none;color:var(--ink);min-width:0}
.golink:hover{border-color:var(--cat)}
.gl-t{font-weight:700;font-size:var(--fs-14)}
.gl-s{grid-column:1/-1;font-size:var(--fs-12);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gl-a{grid-row:1;grid-column:2;color:var(--muted)}
.search{font-size:var(--fs-16)}
.grid-h{display:flex;align-items:center;gap:8px;margin:22px 0 10px;font-size:var(--fs-16);font-weight:700}
.grid-h:first-child{margin-top:0}
.result-count,.empty{font-size:var(--fs-14);color:var(--muted);margin:0 0 10px}

@media (prefers-reduced-motion: reduce){
  *{transition:none!important;animation:none!important}
  .ticket:hover{transform:none}
}
.links{display:flex;justify-content:center;gap:4px;flex-wrap:wrap}
.fb-details{border-radius:16px;background:var(--surface);border:1.5px dashed var(--line)}
.fb-details>summary{list-style:none;cursor:pointer;min-height:52px;display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--accent)}
.fb-details>summary::-webkit-details-marker{display:none}
.fb-details[open]>summary{border-bottom:1px solid var(--line)}
.fb-details .feedback{border:0;background:none}
.icon-btn{width:44px;height:44px}
.tab,.chip-btn,.link-btn{min-height:44px}
body{letter-spacing:-.01em}
h1,.hero-title,.r-title,.d-name,.t-name,.mini .mn{line-height:1.3;letter-spacing:-.025em}
h2,h3,.sec h2,.sec-h{line-height:1.35;letter-spacing:-.015em}
.btn,.tab,.chip-btn,.link-btn,.opt{line-height:1.2}
.field{font-size:var(--fs-16)}
.stack.one{height:auto}
.stack.one .mini-one{position:relative;inset:auto;transform:none;width:100%;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.mini .mx{font-size:var(--fs-12);font-weight:600;color:var(--accent)}
.r-head{display:grid;gap:6px}
.type-emo{font-size:var(--fs-28);line-height:1.2}
.type-desc{margin:0;font-size:var(--fs-16);font-weight:600}
.today{display:grid;gap:8px;padding:14px 16px;border-radius:14px;background:var(--surface);border:1.5px solid var(--cat)}
.today h2{margin:0;font-size:var(--fs-16)}
.today-list{margin:0;padding-left:20px;display:grid;gap:8px}
.today-list a{color:var(--accent);font-weight:600;text-decoration:none}
.live-d>summary{list-style:none;cursor:pointer;min-height:44px;display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--accent);font-size:var(--fs-14)}
.live-d>summary::-webkit-details-marker{display:none}
.live-d[open]>summary{min-height:32px}
.app.has-live{padding-block-end:calc(96px + env(safe-area-inset-bottom,0px))}
.q-hint.react{color:var(--accent);font-weight:600}
.hero-title,.r-title{line-height:1.25;letter-spacing:-.03em}
.stack.one .mini-one{transform:rotate(-2deg);box-shadow:0 8px 18px #14172f1f;margin:6px 4px 10px}
.type-emo{width:56px;height:56px;display:grid;place-items:center;background:#FFF0DC;border-radius:46% 54% 42% 58%;transform:rotate(-6deg);line-height:1}
.today{position:relative;border-radius:18px}
.today h2{display:flex;align-items:center;gap:8px}
.sticker{display:inline-block;font-size:var(--fs-12);font-weight:700;padding:2px 8px;border-radius:999px;background:var(--note-bg);border:1px solid var(--note-line);color:var(--ink);transform:rotate(4deg)}
.today-list{list-style:none;padding-left:0;counter-reset:t}
.today-list li{counter-increment:t;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.today-list li::before{content:counter(t);width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-size:var(--fs-14)}
.opt{transition:transform .12s ease-out,background-color .12s ease-out,border-color .12s ease-out}
.opt:active{transform:scale(.98)}
.type-emo .sprite{width:48px;height:48px;image-rendering:pixelated}
.share-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.share-sq{justify-self:center}
.start-gear,.friend-box{display:grid;gap:10px;padding:16px;border-radius:18px;background:var(--surface);border:1.5px solid var(--cat,var(--line))}
.start-gear .sec-h,.friend-box .sec-h{margin:0}
.start-gear .gear{border:0}
.start-gear .disclose{margin:0}
.ad-slot:empty{display:none}
.tab-lab{margin:0 0 8px;font-size:var(--fs-14);color:var(--muted)}
.ad-lab{margin:0 0 4px;font-size:var(--fs-14);color:var(--muted)}
.golinks.near{margin-top:16px}
.t-line{font-size:var(--fs-14);line-height:1.5;color:var(--ink)}
.t-line b{display:inline-block;margin-right:6px;color:var(--accent);font-weight:700}
.fold{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.fold>summary{list-style:none;display:flex;flex-direction:column;justify-content:center;gap:2px;min-height:56px;padding:12px 48px 12px 16px;position:relative;cursor:pointer}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::after{content:'';position:absolute;right:20px;top:50%;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);transition:transform .2s ease-out}
.fold[open]>summary::after{transform:translateY(-30%) rotate(-135deg)}
.fold .f-t{font-size:var(--fs-16);font-weight:700;color:var(--ink)}
.fold .f-s{font-size:var(--fs-14);color:var(--muted)}
.fold .f-in{padding:0 16px 16px;display:grid;gap:12px}
.fold .f-h{margin:8px 0 0;font-size:var(--fs-16)}
.detail .fold{margin-top:16px}
.t-more{margin-top:4px;color:var(--accent);font-size:var(--fs-14);font-weight:600}
.t-why:empty{display:none}
.more-ways>summary{min-height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);font-size:var(--fs-16)}
.more-ways .links{flex-direction:column;align-items:center}
.tab,.chip-btn,.modes .btn .sub,.q-num,.q-hint,.live-d>summary,.eyebrow,.t-tag,.surprise-h span,.spec,.row .rt,.fb-q>label,.fb-q>.fb-label,.choice button,.fact dd,.gl-t,.g-price,.g-note,.m-desc,.g-sum small,.memo,.d-fit,.d-cat,.sec .sub,.feedback .sub,.fb-wants,.tab-note,.flat-hint,.result-count,.empty,.sample-note,.g-buy{font-size:var(--fs-16)}
.mini .mt,.mini .mx,.live-h,.live-h small,.live-chip .lp,.t-cat,.tag,.t-rank,.t-lab,.track.unk em,.spec-note,.rate-legend,.fact dt,.fact dd small,.gl-s,.m-type,.req,.opt-tag,.ad-tag,.sticker,.d-rare,.chip-btn .rare-mark,.card .cc,.card .cr,.why-box .why-src,.foot{font-size:var(--fs-14)}
.mini .mt,.row .rt{white-space:normal}
.gl-s{white-space:normal;overflow-wrap:anywhere}
.g-buy,.today-list a{min-height:44px}
.today-list a{display:inline-flex;align-items:center}
@media (hover:none){

function hasBatchim(word){
  const c = word.trim().slice(-1).charCodeAt(0);
  if (c < 0xAC00 || c > 0xD7A3) return false;
  return (c - 0xAC00) % 28 !== 0;
}

function man(v){
  const r = v >= 10 ? Math.round(v) : Math.round(v * 10) / 10;
  return Number.isInteger(r) ? String(r) : r.toFixed(1);
}
function priceRange(lo, hi){
  if (lo === 0 && hi === 0) return '0원';
  const small = v => Math.round(v * 10) + '천';
  if (lo === hi) return lo < 1 ? small(lo) + ' 원' : man(lo) + '만 원';
  if (hi < 1) return (lo === 0 ? '0' : small(lo)) + '~' + small(hi) + ' 원';
  if (lo > 0 && lo < 1) return small(lo) + '~' + man(hi) + '만 원';
  return man(lo) + '~' + man(hi) + '만 원';
}

const _costCache = {};
// 시작 비용 = 꼭 필요한 준비물 + 꼭 필요한 이용료 1회분(데이터에 적힌 단위: 1회·1박·시간당·월).
// 몇 번 다니는지는 데이터에 없어서 한 달 비용은 만들지 않고, 월 단위 항목이 있을 때만 '계속하면'으로 따로 보여줌
const UNIT_FIRST = {'1회':'첫 1회', '월':'첫 달', '1박':'첫 1박', '시간당':'첫 1시간'};
function costInfo(h){
  if (_costCache[h.id]) return _costCache[h.id];
  let lo = 0, hi = 0;
  const rec = {};
  h.g.forEach(g => {
    if (!g[1]) return;
    if (g[4]) { rec[g[4]] = rec[g[4]] || [0, 0]; rec[g[4]][0] += g[2]; rec[g[4]][1] += g[3]; }
    else { lo += g[2]; hi += g[3]; }
  });
  const recList = Object.keys(rec).map(u => ({u, lo: rec[u][0], hi: rec[u][1]}));
  const startLo = lo + recList.reduce((s, r) => s + r.lo, 0);
  const startHi = hi + recList.reduce((s, r) => s + r.hi, 0);
  const parts = [];
  if (hi > 0) parts.push('준비물 ' + priceRange(lo, hi));
  recList.forEach(r => parts.push((UNIT_FIRST[r.u] || r.u) + ' ' + priceRange(r.lo, r.hi)));
  const monthly = h.g.filter(g => g[4] === '월').map(g => ({name: g[0], req: !!g[1], lo: g[2], hi: g[3]}));
  const label = startHi > 0 ? priceRange(startLo, startHi) : '거의 0원';
  return (_costCache[h.id] = {lo, hi, recList, startLo, startHi, parts, monthly, label});
}
function keepCostText(ci){

  const per = ci.recList.filter(r => r.u !== '월');
  if (per.length) return '계속하면 ' + per.map(r => r.u + ' ' + priceRange(r.lo, r.hi)).join(', ') + '씩 들고, 한 달 비용은 횟수에 따라 달라요';
  return '목록에 정기적으로 드는 비용은 없어요';
}
const BUDGET_CAP = [0, 5, 20, 50, Infinity];  // 예산 답 1~4의 상한(만 원)
function costLevel(v){ return v <= 5 ? 1 : v <= 20 ? 2 : v <= 50 ? 3 : 4; }
// 가격 범위 전체가 예산 안 'in', 싸게 시작하면 예산 안 'edge', 가장 싸도 넘음 'over'
function budgetFit(h, p){ const c = costInfo(h), cap = BUDGET_CAP[p.budget]; return c.startHi <= cap ? 'in' : c.startLo <= cap ? 'edge' : 'over'; }

// 화면에 보이는 시간 문구(h.time)에서 주당 시간 범위를 읽음. 문구에 주당 양이 없으면(반나절·하루·1박 등) 데이터의 hours를 씀
const _weekCache = {};
function weekHours(h){
  if (_weekCache[h.id]) return _weekCache[h.id];
  const N = '(\\d+(?:\\.\\d+)?)(?:~(\\d+(?:\\.\\d+)?))?';
  const dur = t => {
    let m = t.match(new RegExp('^' + N + '분~' + N + '시간$')); if (m) return [m[1] / 60, +(m[4] || m[3])];
    m = t.match(/^(\d+)시간 (\d+)분$/); if (m) return [+m[1] + m[2] / 60, +m[1] + m[2] / 60];
    m = t.match(new RegExp('^' + N + '시간( 이상)?$')); if (m) return [+m[1], +(m[2] || m[1])];
    m = t.match(new RegExp('^' + N + '분$')); if (m) return [m[1] / 60, (m[2] || m[1]) / 60];
    return null;
  };
  const per = (re, k) => { const m = h.time.match(re), d = m && dur(m[3]); return d ? [m[1] * d[0] * k, (m[2] || m[1]) * d[1] * k] : null; };
  let r = per(new RegExp('^주 ' + N + '회 · (.+)$'), 1) || per(new RegExp('^격주 ' + N + '회 · (.+)$'), 0.5) ||
          per(new RegExp('^(?:한 달|월) ' + N + '회 · (.+)$'), 12 / 52);
  if (!r) { const m = h.time.match(/^(?:하루|매일) (.+)$/), d = m && dur(m[1]); if (d) r = [7 * d[0], 7 * d[1]]; }
  if (!r) { const m = h.time.match(/^(?:주말|주|틈날 때 · 주) (.+)$/), d = m && dur(m[1]); if (d) r = d; }
  return (_weekCache[h.id] = r ? {lo: r[0], hi: r[1], fromText: true} : {lo: h.hours, hi: h.hours, fromText: false});
}
function timeFit(h, p){ const w = weekHours(h); return w.hi <= p.hours ? 'in' : w.lo <= p.hours ? 'edge' : 'over'; }

function profileFrom(answers){
  const sum = {}, cnt = {};
  const p = {u:{}, needs:[], hours:99, budget:4, stage:null, traitCount:0};
  answers.forEach((ai, qi) => {
    if (ai == null) return;
    const o = QUESTIONS_DETAIL[qi] && QUESTIONS_DETAIL[qi].o[ai];
    if (!o) return;
    if (o.v) { p.traitCount++; Object.keys(o.v).forEach(k => { sum[k] = (sum[k] || 0) + o.v[k]; cnt[k] = (cnt[k] || 0) + 1; }); }
    if (o.needs) o.needs.forEach(n => { if (!p.needs.includes(n)) p.needs.push(n); });
    if (o.stage) p.stage = o.stage;
    if (o.hours != null) p.hours = o.hours;
    if (o.budget != null) p.budget = o.budget;
  });
  AXES.forEach(a => { p.u[a.k] = cnt[a.k] ? sum[a.k] / cnt[a.k] : 0.5; });
  p.cnt = cnt;
  return p;
}

function needMatch(h, p){ return p.needs.find(n => h.need.includes(n)) || null; }

function scoreHobby(h, p){
  let num = 0, den = 0;
  AXES.forEach(a => {
    if (!p.cnt[a.k]) return;  // 답에서 읽지 못한 성향은 가운데(0.5)로 치지 않고 계산에서 뺌
    const u = p.u[a.k], w = 0.35 + Math.abs(u - 0.5) * 2;
    num += w * (1 - Math.abs(u - h.v[a.k]));
    den += w;
  });
  let s = den ? num / den : 0.5;
  if (needMatch(h, p)) s += 0.05;
  if (budgetFit(h, p) === 'over') s -= 0.07 * (costLevel(costInfo(h).startLo) - p.budget);
  if (timeFit(h, p) === 'over') s -= 0.05;
  if (h.rare) s -= 0.03;
  return s;  // 순위는 자르지 않은 점수로 (0.99에서 잘라 동점이 생기던 문제)
}

function reasonsFor(h, p){
  const c = [];
  AXES.forEach(a => {
    const u = p.u[a.k], d = u - 0.5;
    if (Math.abs(d) < 0.15) return;
    const hv = h.v[a.k];
    if ((d > 0 && hv < 0.45) || (d < 0 && hv > 0.55)) return;
    c.push({t: d > 0 ? a.hi : a.lo, w: Math.abs(d) * (1 - Math.abs(u - hv))});
  });
  c.sort((x, y) => y.w - x.w);
  const out = c.slice(0, 2).map(x => x.t);
  const nm = needMatch(h, p);
  if (nm) out.push(NEEDS[nm]);
  if (out.length < 3 && p.budget < 4 && budgetFit(h, p) === 'in') out.push('예산 안에서 시작');
  if (out.length < 3 && p.hours < 99 && timeFit(h, p) === 'in') out.push('시간 여유 맞음');
  return out.slice(0, 3);
}

// 2: 가격·시간 범위가 모두 답 안 / 1: 싸게·짧게 잡으면 답 안(따로 알림) / 0: 가장 싸고 짧게 잡아도 넘음. 추천은 2 → 1 → 0 순
function fitsConstraints(h, p){ const b = budgetFit(h, p), t = timeFit(h, p); return b === 'over' || t === 'over' ? 0 : b === 'in' && t === 'in' ? 2 : 1; }
function constraintNotes(h, p){
  const w = [], b = budgetFit(h, p), t = timeFit(h, p);
  if (b === 'over') w.push('시작 비용이 예산보다 많아요'); else if (b === 'edge') w.push('가격에 따라 예산을 넘을 수 있어요');
  if (t === 'over') w.push('시간이 더 필요해요'); else if (t === 'edge') w.push('시간이 더 들 수 있어요');
  return w;
}

function fam(h){ return (CATS[h.cat] || {}).fam || 'make'; }

function rankAll(p){
  // 예산·시간은 사용자가 밝힌 조건이라 먼저 맞는 것부터, 그 안에서 점수 순.
  // shortcut: 나이를 묻지 않아 술 관련 취미는 추천에서 빼고 둘러보기에서만 보여줌, 나이 확인을 넣으면 다시 검토
  return HOBBIES.filter(h => !h.adult).map(h => ({h, s: scoreHobby(h, p), fit: fitsConstraints(h, p)}))
    .sort((a, b) => (b.fit - a.fit) || (b.s - a.s) || (a.h.id < b.h.id ? -1 : 1));  // 점수까지 같으면 id 순: 데이터 순서를 바꿔도 결과가 같게
}

function pickDiverse(list, n, perCat){
  const out = [], cnt = {};
  for (const x of list) {
    if (out.length >= n) break;
    const c = x.h.cat;
    if ((cnt[c] || 0) >= perCat) continue;
    cnt[c] = (cnt[c] || 0) + 1;
    out.push(x);
  }
  return out;
}

function similarTo(h){
  // 술 관련 취미는 둘러보기에서만 보여주는 방침이라 비슷한 취미 추천에서도 뺌
  return HOBBIES.filter(x => x.id !== h.id && !x.adult).map(x => {
    let d = 0; AXES.forEach(a => { d += Math.abs(x.v[a.k] - h.v[a.k]); });
    return {x, d};
  }).sort((a, b) => a.d - b.d).slice(0, 3).map(o => o.x);
}

function profileSentence(p){
  const ranked = AXES.map(a => ({a, d: p.u[a.k] - 0.5})).filter(o => Math.abs(o.d) >= 0.15)
    .sort((x, y) => Math.abs(y.d) - Math.abs(x.d)).slice(0, 2)
    .map(o => o.d > 0 ? o.a.hi : o.a.lo);
  let s = '';
  if (ranked.length === 2) s = '<b>' + ranked[0] + '</b>' + (hasBatchim(ranked[0]) ? '과' : '와') + ' <b>' + ranked[1] + '</b>' + (hasBatchim(ranked[1]) ? '을' : '를') + ' 좋아하는 편이에요.';
  else if (ranked.length === 1) s = '<b>' + ranked[0] + '</b>' + (hasBatchim(ranked[0]) ? '을' : '를') + ' 좋아하는 편이에요.';
  else s = '여러 방향에 고르게 열려 있는 편이에요.';
  if (p.needs.length) { const n = NEEDS[p.needs[0]]; s += ' 요즘은 <b>' + n + '</b>' + (hasBatchim(n) ? '이' : '가') + ' 필요해 보여요.'; }
  return s;
}

function buildResult(p){
  const ranked = rankAll(p);
  const top = pickDiverse(ranked, 3, 1);
  const topIds = top.map(x => x.h.id);
  const isFreshRare = x => x.h.rare && x.fit === 2 && !topIds.includes(x.h.id) && x.s >= 0.6;
  const surprise = ranked.find(x => isFreshRare(x) && !top.some(t => t.h.cat === x.h.cat)) || ranked.find(isFreshRare) || null;
  const used = topIds.concat(surprise ? [surprise.h.id] : []);
  const more = pickDiverse(ranked.filter(x => !used.includes(x.h.id)), 5, 1);
  return {ranked, top, surprise, more};
}
function typeOf(p){  // 측정 안 된 성향은 0.5로 봐요 (기획안과 같은 기준)

  return {code, emoji: TYPES[code][0], name: TYPES[code][1], desc: TYPES[code][2]};
}

// result card image (레퍼런스 문서 3-1). Colors: background, ink, type color, accent — no gradient/shadow/emoji.
async function drawCard(fmt){
  const I = shareInfo(); if (!I) return null;
  const sq = fmt === 'square', W = 1080, H = sq ? 1080 : 1920, safe = sq ? 64 : 250;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d'), BG = '#FBF7EF', INK = '#1B1B22', TC = CARD[I.t.code][0];  // 3 colors + the animal
  const BRAND = '"Bagel Fat One", sans-serif', BODY = '"Pretendard Variable", Pretendard, sans-serif';
  try { await Promise.all([document.fonts.load('80px "Bagel Fat One"', I.t.name + '낙'), document.fonts.load('600 40px "Pretendard Variable"', '가')]); } catch (_) {}
  const img = new Image(); img.src = SPRITES[I.t.code]; try { await img.decode(); } catch (_) {}
  x.fillStyle = BG; x.fillRect(0, 0, W, H); x.textBaseline = 'top'; x.textAlign = 'center';
  let y = safe;
  x.fillStyle = INK; x.font = '44px ' + BRAND; x.fillText('낙낙', W / 2, y); y += sq ? 76 : 96;
  // pixel animal in a box
  const box = sq ? 300 : 400, bx = (W - box) / 2;
  x.fillStyle = TC; x.fillRect(bx, y, box, box); x.globalAlpha = .78; x.fillStyle = BG; x.fillRect(bx, y, box, box); x.globalAlpha = 1; /* light tint of the type color so the animal stands out */ x.strokeStyle = INK; x.lineWidth = 6; x.strokeRect(bx, y, box, box);
  x.imageSmoothingEnabled = false; if (img.naturalWidth) x.drawImage(img, bx + box * .1, y + box * .1, box * .8, box * .8);
  y += box + (sq ? 40 : 64);
  x.fillStyle = INK; x.font = '600 36px ' + BODY; x.fillText('나는', W / 2, y); y += 52;
  x.font = (sq ? '72px ' : '88px ') + BRAND; x.fillText(I.t.name, W / 2, y); y += sq ? 96 : 120;
  x.font = '600 36px ' + BODY;
  for (const line of wrap(x, CARD[I.t.code][1], W - 200).slice(0, 2)) { x.fillText(line, W / 2, y); y += 52; }
  y += sq ? 12 : 28; x.fillStyle = INK; x.font = '700 32px ' + BODY; x.fillText('나한테 맞는 취미 1순위', W / 2, y); y += 52;
  x.font = (sq ? '52px ' : '64px ') + BRAND; x.fillStyle = TC; x.fillText(I.R.top[0].h.name, W / 2, y); y += sq ? 70 : 88;
  // why this is #1: the traits from my answers that this hobby fits (+ the hobby's own appeal on the story card)
  if (I.why) { x.fillStyle = INK; x.font = '700 32px ' + BODY; x.fillText(I.why + '라서 딱', W / 2, y); y += 50; }
  x.fillStyle = TC; x.font = '600 30px ' + BODY; x.fillText(I.fact, W / 2, y); y += 52;
  if (!sq) {
    // story keeps one hobby + one fact (GPT card review); 2·3위 and the friend pick stay in the app
  }
  // bottom band (type color), above the bottom safe area
  const bh = sq ? 130 : 150, by = H - safe - bh + (sq ? safe : 0);
  x.fillStyle = TC; x.fillRect(0, by, W, bh);
  const P = window.NAKNAK_PLATFORM || {};
  x.fillStyle = '#FFFFFF'; x.font = (sq ? '40px ' : '44px ') + BRAND; x.fillText('너는 무슨 낙이야?', W / 2, by + (sq ? 22 : 28));
  x.font = '600 26px ' + BODY; x.fillText(P.footer || '낙낙 취미 테스트', W / 2, by + (sq ? 78 : 92));
  x.textAlign = 'left';
  return c.toDataURL('image/png');
}
function wrap(x, text, w){ const out = []; let line = '';
  for (const ch of String(text)) { if (x.measureText(line + ch).width > w && line) { out.push(line); line = ch.trim(); } else line += ch; }
  if (line) out.push(line); return out; }

function taskDone(h, task){

function pathState(h){
  const stages = pathStages(h), index = stages.findIndex(stage => stage.tasks.some(t => !taskDone(h, t)));

function setTask(h, task, done){
  if (task.prep != null) {
    const checks = Array.isArray(S.checks[h.id]) ? S.checks[h.id] : (S.checks[h.id] = []);
    checks[task.prep] = done; lsSet(LS_CHECKS, S.checks);
  } else {
    const valid = new Set(pathStages(h).flatMap(s => s.tasks).filter(t => t.prep == null).map(t => t.key));
    const keys = [...new Set(S.path[h.id] || [])].filter(k => k !== task.key && valid.has(k));
    S.path[h.id] = done ? keys.concat(task.key) : keys; lsSet(LS_PATH, S.path);

function renderQuiz(){

  const sel = S.answers[S.qi];
  const art = QART[S.qi] || {sky: 5};

        '<h1 class="q-text">' + esc(Q.q) + '</h1></div>' + (art.img ? '<img class="q-art" src="' + QART_IMG[art.img] + '" alt="" width="88" height="88">' : '') + '</div>' +

      '<p class="q-hint">' + esc(Q.hint || '딱 맞는 답이 없으면 가장 가까운 걸 골라주세요.') + '</p>' +
    '</section>';
}

function renderLive(){
  if (S.screen !== 'quiz') { liveSlot.innerHTML = ''; appEl.classList.remove('has-live'); return; }
  appEl.classList.add('has-live');
  const p = profileFrom(S.answers);
  let inner;
  if (p.traitCount < 1) {
    inner = '<div class="live-h"><span>지금까지 어울리는 낙</span></div><div class="live-empty">성향 질문에 답하기 시작하면 여기에 추천이 떠올라요.</div>';
    S.liveIds = [];
  } else {
    const top = pickDiverse(rankAll(p), 3, 1);
    const prev = S.liveIds;
    inner = '<div class="live-h"><span>지금까지 어울리는 낙</span><small>답할수록 또렷해져요</small></div><div class="live-row">' +
      top.map((x, i) => { const fresh = prev.length && !prev.includes(x.h.id);
        return '<button class="live-chip' + (fresh ? ' fresh' : '') + '" data-cat="' + fam(x.h) + '" data-act="hobby" data-id="' + x.h.id + '"><span class="ln">' + esc(x.h.name) + '</span><span class="lp">' + (i + 1) + '위' + (fresh ? ' · 새로 떠올랐어요' : '') + '</span></button>'; }).join('') + '</div>';
    S.liveIds = top.map(x => x.h.id);
  }
  liveSlot.innerHTML = '<aside class="live" aria-label="실시간 추천"><details class="live-d"' + (S.liveOpen ? ' open' : '') + '><summary>' + (S.liveIds.length ? '<img class="hobby-art" src="' + hobbyArt(byId[S.liveIds[0]]) + '" alt="" width="28" height="28">지금 1위: ' + esc(byId[S.liveIds[0]].name) : '지금까지 어울리는 낙 보기') + '</summary><div class="live-in">' + inner + '</div></details></aside>';
  setTimeout(() => liveSlot.querySelectorAll('.live-chip.fresh').forEach(el => el.classList.remove('fresh')), 900);
}

/* result */
function ticket(item, i, p, first){
  const h = item.h, why = reasonsFor(h, p).slice(0, 2), warn = constraintNotes(h, p);
  const description = i ? differenceFromFirst(first, h) || h.why[0] : why.join(' · ');
  return '<button class="ticket' + (i === 0 ? ' top1' : '') + '" data-cat="' + fam(h) + '" data-act="hobby" data-id="' + h.id + '">' +
    '<img class="hobby-art" src="' + hobbyArt(h) + '" alt="" width="140" height="140">' +
    '<span class="t-cat">당신의 낙 ' + (i + 1) + '위 · ' + CATS[h.cat].label + '</span>' +
    '<span class="t-name">' + esc(h.name) + '</span>' +
    (description ? '<span class="t-line t-fit">' + (i === 0 ? '<b>나와 맞는 점</b>' : '') + esc(description) + '</span>' : '') +
    (warn.length ? '<span class="t-why">' + esc(warn.join(' · ')) + '</span>' : '') + '</button>';
}
function differenceFromFirst(a, b){
  const words = {
    move:['몸을 더 써요','몸을 덜 써요'],
    social:['사람들과 함께해요','혼자 하기 좋아요'],
    make:['만든 게 남아요','하는 순간이 재미예요'],
    outdoor:['밖에서 해요','집 안에서 해요'],
    grow:['실력이 쌓이는 재미가 커요','부담 없이 즐겨요'],
    think:['머리를 써요','생각을 비워요']
  };
  let axis = null, delta = 0;
  for (const {k} of AXES) {
    const av = a && a.v && a.v[k], bv = b && b.v && b.v[k];
    if (typeof av !== 'number' || typeof bv !== 'number' || !Number.isFinite(av) || !Number.isFinite(bv)) continue;
    const d = bv - av;
    if (Math.abs(d) > Math.abs(delta)) { axis = k; delta = d; }
  }
  return axis && Math.abs(delta) >= 0.2 ? '1위보다 ' + words[axis][delta > 0 ? 0 : 1] : '';
}
function pickRow(item, n, p, first){  // number · name · one line ›
  const h = item.h, warn = constraintNotes(h, p);
  const diff = first ? differenceFromFirst(first, h) : '';
  return '<button class="ticket trow" data-cat="' + fam(h) + '" data-act="hobby" data-id="' + h.id + '"><span class="no">' + n + '</span>' +
    '<span class="m"><span class="t-name">' + esc(h.name) + '</span><span class="t-tag' + (diff ? ' difference' : '') + '">' + esc(diff || h.why[0]) + '</span>' +
    (warn.length ? '<span class="t-why">' + warn.map(w => '<span class="tag warn">' + esc(w) + '</span>').join('') + '</span>' : '') +
    '</span><span class="go" aria-hidden="true">›</span></button>';
}

// 자세히 결과: 추가 질문의 내 답 중 1순위 취미와 같은 쪽인 것(성향 차이 0.3 미만, 가까운 순, 같으면 취미가 그 성향이 뚜렷한 쪽) + 목적이 맞으면 그 답
function whyFacts(h, a){
  const out = [];
  QUESTIONS_DETAIL.slice(QUESTIONS.length).forEach((q, k) => {
    const o = q.o[a[QUESTIONS.length + k]];
    if (!o || !o.f) return;
    if (o.v) { const k = Object.keys(o.v)[0], u = o.v[k] - 0.5, hv = h.v[k] - 0.5;
      if (Math.abs(o.v[k] - h.v[k]) < 0.3 && u * hv > 0) out.push({f: o.f, d: Math.abs(o.v[k] - h.v[k]) - Math.abs(hv) / 10}); }
    else if (o.needs && o.needs.some(n => h.need.includes(n))) out.push({f: o.f, d: 0.1});
  });
  return out.sort((x, y) => x.d - y.d).slice(0, 3).map(x => x.f);
}
function whyBox(h, a){
  const facts = whyFacts(h, a);
  if (!facts.length) return '';
  return '<section class="why-box" data-cat="' + fam(h) + '"><h2 class="sec-h">왜 ' + esc(h.name) + (hasBatchim(h.name) ? '이' : '가') + ' 잘 맞을까요?</h2>' +
    '<ul>' + facts.map(f => '<li>' + esc(f) + '</li>').join('') + '</ul><p class="why-src">자세히 찾기에서 고른 답을 바탕으로 추천했어요.</p></section>';
}

// 답이 모든 성향에서 가운데 근처면(측정한 성향의 |u-0.5| 합 < 0.6, 무작위·페르소나 답 모두 하위 약 10%) 여러 취미가 비슷하게 맞음
function isFlat(p){ return AXES.reduce((t, a) => t + (p.cnt[a.k] ? Math.abs(p.u[a.k] - 0.5) : 0), 0) < 0.6; }
function flatHint(p){
  if (S.sample || !isFlat(p)) return '';
  return modeOf(currentAnswers()) === 'detail'
    ? '<p class="flat-hint">답이 고르게 나와서 여러 취미가 비슷하게 잘 맞아요. 2·3순위도 1순위만큼 어울려요.</p>'
    : '<p class="flat-hint">답이 고르게 나와서 여러 취미가 비슷하게 잘 맞아요. <button class="link-btn" data-act="start" data-mode="detail">자세히 찾기</button>로 하면 더 뚜렷해져요.</p>';
}

function renderResult(){
  const p = currentProfile();

function feedbackText(){
  const p = currentProfile();
  const R = buildResult(p);

  return '[낙낙 ' + APP_VERSION + ' 테스트 피드백]\n' +
    '나: ' + (stage ? stage.label : '-') + ' · ' + (reasonQ ? reasonQ.t : '-') + (S.sample ? ' (예시 결과)' : '') + '\n' +

function mediaLink(m){
  const [type, title] = m;
  if (SITE_URL[title]) return SITE_URL[title];
  if (type === '유튜브') return 'https://www.youtube.com/results?search_query=' + encodeURIComponent(title);
  return 'https://search.naver.com/search.naver?query=' + encodeURIComponent(title + (type === '앱' || type === '사이트' || type === '서비스' ? '' : ' ' + type));
}

function fold(key, title, sub, body){
  return '<details class="fold" data-f="' + key + '"' + (S.folds[key] ? ' open' : '') + '><summary><span class="f-t">' + title + '</span>' + (sub ? '<span class="f-s">' + sub + '</span>' : '') + '</summary><div class="f-in">' + body + '</div></details>';
}

.414 0z\" />", "learn": "<path d=\"M12 7v14\" /> <path d=\"M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z\" />", "people": "<path d=\"M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z\" /> <path d=\"M12 5 9.04 7.96a2.17 2.17 0 0 0 0 3.08c.82.82 2.13.85 3 .07l2.07-1.9a2.82 2.82 0 0 1 3.79 0l2.96 2.66\" /> <path d=\"m18 15-2-2\" /> <path d=\"m15 18-2-2\" />", "rare": "<path d=\"M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z\" /> <path d=\"M20 3v4\" /> <path d=\"M22 5h-4\" /> <path d=\"M4 17v2\" /> <path d=\"M5 18H3\" />"};
function catIcon(k){ return '<svg class="cat-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + CAT_ICON[k] + '</svg>'; }
function catCard(k, label, n){
  return '<button class="cat-card" data-act="filter" data-f="' + k + '">' + catIcon(k) + '<span class="cat-name">' + label + '</span><span class="cat-n">' + n + '개</span></button>';
}
function inFilter(h){ return S.filter === 'all' || (S.filter === 'rare' ? h.rare : h.cat === S.filter); }
function renderBrowse(){
  if (S.filter !== 'all') {
    return bar(S.filter === 'rare' ? '숨은 취미' : CATS[S.filter].label, HOBBIES.filter(inFilter).length + '개') +
      '<section class="browse"><div id="browse-list">' + browseList() + '</div></section>';
  }
  return bar('어떤 취미가 있을까', HOBBIES.length + '개') +
  '<section class="browse">' +
    '<label class="search-label" for="browse-q">취미 이름으로 찾기</label><input class="field search" id="browse-q" type="search" autocomplete="off" placeholder="예: 한지, 피규어" value="' + esc(S.q) + '">' +
    '<div id="browse-list">' + browseList() + '</div>' +
  '</section>';
}
function card(h){
  return '<button class="card" data-cat="' + fam(h) + '" data-act="hobby" data-id="' + h.id + '">' + '<span class="cn">' + esc(h.name) + (h.adult ? ' <span class="cr">19+</span>' : h.rare ? ' <span class="cr">숨은</span>' : '') + '</span><span class="cc">' + esc(costInfo(h).label) + '</span><span class="ct">' + esc(h.tag) + '</span></button>';
}
function norm(s){ return String(s).replace(/\s+/g, '').toLowerCase(); }
function browseList(){
  const q = norm(S.q);
  let list = HOBBIES.filter(inFilter);
  if (q) list = list.filter(h => norm(h.name + h.tag + CATS[h.cat].label).includes(q));
  if (!list.length) return '<p class="empty">‘' + esc(S.q) + '’에 맞는 취미가 아직 없어요. 결과 화면 피드백으로 알려주시면 추가할게요.</p><button class="btn block" data-act="clearq">검색어 지우기</button>';
  if (S.filter === 'all' && !q) {
    return '<div class="cat-grid">' + Object.keys(CATS).filter(c => (byCat[c] || []).length).map(c => catCard(c, CATS[c].label, byCat[c].length)).join('') +
      catCard('rare', '숨은 취미', HOBBIES.filter(h => h.rare).length) + '</div>';
  }
  // inside a category the app bar already shows the count
  return (S.filter === 'all' ? '<p class="result-count">' + list.length + '개</p>' : '') + '<div class="grid">' + list.map(card).join('') + '</div>';
}

function render(toTop){
  let html = '';
  if (S.screen === 'quiz') html = renderQuiz();
  else if (S.screen === 'result') html = renderResult();
  else if (S.screen === 'detail' && byId[S.hobby]) html = renderDetail();
  else if (S.screen === 'browse') html = renderBrowse();
  else if (S.screen === 'find') html = renderFind();
  else if (S.screen === 'my' && byId[S.hobby]) html = renderMy();
  else { S.screen = 'home'; html = renderHome(); }
  view.innerHTML = html;
  renderLive();
  if (toTop) {
    window.scrollTo(0, 0);
    const t = view.querySelector('h1') || view.querySelector('.bar-title');
    if (t) { t.tabIndex = -1; t.focus({preventScroll: true}); }
  }
}

// 앞으로 가는 이동마다 브라우저 기록을 하나 쌓아, 폰의 뒤로가기가 앱 밖으로 나가지 않고 앞 화면으로 돌아오게 함
function nav(patch){
  stack.push({screen: S.screen, hobby: S.hobby, dtab: S.dtab, qi: S.qi, sample: S.sample, deck: S.deck, filter: S.filter});
  try { history.pushState({nk: stack.length}, ''); } catch(e){}
  if (patch.screen === 'result') S.deck = 0;
  Object.assign(S, patch);
}
function go(screen, patch){ nav(Object.assign({}, patch, {screen})); render(true); }
function popTo(n){
  let prev; while (stack.length > n) prev = stack.pop();
  if (prev) { Object.assign(S, prev); render(true); }
}
function back(){
  if (history.state && history.state.nk === stack.length && stack.length) history.back();  // popstate가 되돌림
  else if (stack.length) popTo(stack.length - 1);
  else { S.screen = 'home'; render(true); }
}
window.addEventListener('popstate', e => { const n = (e.state && e.state.nk) || 0; if (n < stack.length) popTo(n); });

function copyFeedback(){
  const text = feedbackText();
  const status = document.getElementById('fb-status');
  const out = document.getElementById('fb-out');
  const ok = () => { status.hidden = true; out.hidden = true; toast('복사했어요. 카톡이나 문자에 붙여넣어 보내주세요.'); };
  const fallback = () => {
    out.hidden = false; out.value = text; out.style.minHeight = '180px';
    out.focus(); out.select();
    status.hidden = false; status.textContent = '자동 복사가 안 돼요. 아래 글을 길게 눌러 복사해주세요.';
  };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fallback);
    else fallback();
  } catch(e){ fallback(); }
}

let sheetOpenedAt = 0;
function keepScroll(fn){ const y = window.scrollY; fn(); window.scrollTo(0, y); }

function onClick(e){
  const sheet = document.getElementById('share-sheet');
  if (sheet && e.target === sheet) { if (Date.now() - sheetOpenedAt > 400) closeSheet(); return; }  // tap on the dim backdrop
  const el = e.target.closest('[data-act]');
  if (!el || el.dataset.act === 'check' || el.dataset.act === 'pathcheck') return;
  const act = el.dataset.act;
  if (act === 'sheet') { if (sheet && !sheet.hasAttribute('open')) { sheetOpenedAt = Date.now(); sheet.showModal ? sheet.showModal() : sheet.setAttribute('open', ''); } return; }
  if (act === 'sheet-close') { closeSheet(); return; }
  if (act === 'share') { closeSheet(); shareResult(); return; }  // the toast shows on the page, not behind the sheet
  if (act === 'saveimg') { saveImage(el, el.dataset.fmt); return; }
  if (act === 'start' || act === 'retry') { bump('started'); go('quiz', {mode: el.dataset.mode || S.mode, qi:0, answers:[], sample:false, tab:'all', liveIds:[]}); }
  else if (act === 'sample') { go('result', {mode:'quick', sample:true, tab:'all'}); }
  else if (act === 'last') { const a = loadLast(); if (a) go('result', {mode: modeOf(a), result:a, sample:false, tab:'all'}); }
  else if (act === 'browse') { go('browse', {filter:'all', q:''}); }
  else if (act === 'back') { back(); }
  else if (act === 'hobby') { bump('seen', el.dataset.id); go('detail', {hobby: el.dataset.id, dtab: el.dataset.tab || 'sum'}); }
  else if (act === 'dtab') { S.dtab = el.dataset.t; render(false); window.scrollTo(0, 0); const t = document.getElementById('dt-' + S.dtab); if (t) t.focus({preventScroll: true}); }
  else if (act === 'clearq') { S.q = ''; const i = document.getElementById('browse-q'), box = document.getElementById('browse-list'); if (box) box.innerHTML = browseList(); if (i) { i.value = ''; i.focus(); } }
  else if (act === 'filter') { go('browse', {filter: el.dataset.f}); }
  else if (act === 'tab') { S.tab = el.dataset.t; keepScroll(() => render(false)); }
  else if (act === 'want') { chooseHobby(el.dataset.id || S.hobby); }
  else if (act === 'find') { go('find'); }
  else if (act === 'my') { go('my', {hobby:el.dataset.id, folds:{}}); }
  else if (act === 'pathfold') {
    S.folds[el.dataset.key] = el.getAttribute('aria-expanded') !== 'true';
    keepScroll(() => render(false));
    view.querySelector('[data-key="' + el.dataset.key + '"]').focus({preventScroll:true});
  }
  else if (act === 'done') {
    if (el.disabled) return;
    const h = byId[el.dataset.id], next = pathState(h).next;
    if (!next) return;
    el.disabled = true; setTask(h, next, true);
    const task = view.querySelector('.current-task'), reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const update = () => {
      if (!el.isConnected || S.screen !== 'home') return;
      keepScroll(() => render(false));
      if (!reduce) view.querySelector('.current-task').classList.add('task-enter');
      view.querySelector('.task-done').focus({preventScroll:true});
    };
    if (reduce) update(); else { task.classList.add('task-leave'); setTimeout(update, 150); }
  }
  else if (act === 'remove') {
    const id = el.dataset.id, before = S.wants.slice();
    S.wants = S.wants.filter(x => x !== id); lsSet(LS_WANTS, S.wants); go('home');
    toast('내 취미에서 뺐어요', () => {
      if (!S.wants.includes(id)) S.wants.splice(Math.min(before.indexOf(id), S.wants.length), 0, id);
      lsSet(LS_WANTS, S.wants); keepScroll(() => render(false));
    });
  }
  else if (act === 'rate') {
    S.fb.rate = Number(el.dataset.n);
    view.querySelectorAll('[data-act="rate"]').forEach(b => b.setAttribute('aria-pressed', String(b === el)));
  }
  else if (act === 'week') {
    S.fb.week = el.dataset.v;
    view.querySelectorAll('[data-act="week"]').forEach(b => b.setAttribute('aria-pressed', String(b === el)));
  }
  else if (act === 'copyfb') { copyFeedback(); }
  else if (act === 'opt') {
    if (S.busy || e.detail > 1) return;
    S.answers[S.qi] = Number(el.dataset.i);
    view.querySelectorAll('.opt').forEach(b => b.setAttribute('aria-pressed', String(b === el)));
    renderLive();
    const hint = view.querySelector('.q-hint');
    if (hint) { hint.textContent = REACT[S.qi % REACT.length]; hint.classList.add('react'); }
    S.busy = true;
    setTimeout(() => {
      S.busy = false;
      if (S.qi < QS().length - 1) { nav({qi: S.qi + 1}); render(true); }
      else { S.result = S.answers.slice(); lsSet(S.mode === 'detail' ? LS_LAST_D : LS_LAST, S.result); lsSet(LS_MODE, S.mode); S.fb.rate = 0; S.fb.week = ''; bump('completed'); nav({screen:'result', sample:false, tab:'all'}); render(true); }
    }, 260);
  }
}
view.addEventListener('click', onClick);
view.addEventListener('toggle', e => { if (e.target.matches && e.target.matches('.fb-details')) S.fbOpen = e.target.open; if (e.target.matches && e.target.matches('.fold')) S.folds[e.target.dataset.f] = e.target.open; }, true);
view.addEventListener('click', e => { const a = e.target.closest('a[data-kind]'); if (a) bump('links', a.dataset.kind); });
liveSlot.addEventListener('click', onClick);
liveSlot.addEventListener('toggle', e => { if (e.target.matches && e.target.matches('.live-d')) S.liveOpen = e.target.open; }, true);
view.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset && el.dataset.act === 'pathcheck') {
    const h = byId[S.hobby], task = pathStages(h).flatMap(s => s.tasks).find(t => t.key === el.dataset.key);
    if (task) {
      setTask(h, task, el.checked); keepScroll(() => render(false));
      const target = view.querySelector('.path-stage.current .stage-head') || view.querySelector('.info-link');
      target.focus({preventScroll:true});
    }
  }
  if (el.dataset && el.dataset.act === 'check') {
    const arr = Array.isArray(S.checks[S.hobby]) ? S.checks[S.hobby] : (S.checks[S.hobby] = []);
    arr[Number(el.dataset.i)] = el.checked;
    lsSet(LS_CHECKS, S.checks);
  }
});
view.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'browse-q') {
    S.q = t.value;
    const box = document.getElementById('browse-list');
    if (box) box.innerHTML = browseList();
    return;
  }
  const k = t.dataset && t.dataset.fb;
  if (k) S.fb[k] = t.value;
});

function start(data){
  if (data && data.S) { S = Object.assign(S, data.S, {busy:false}); stack = data.stack || []; }
  try { history.replaceState({nk: stack.length}, ''); } catch(e){}
  render(false);
}
if (window.claude && window.claude.hot && typeof window.claude.hot.snapshot === 'function') {
  window.claude.hot.snapshot(() => ({S, stack}));
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});

</script>

<script>if('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
